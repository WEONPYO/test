<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말티프 댕댕이의 열공 지킴이</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #fef6e4 0%, #f3d2c1 100%);
            min-height: 100vh;
        }
        .jua-font {
            font-family: 'Jua', sans-serif;
        }
        @keyframes breathe {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-4px) scale(1.01); }
        }
        .animate-breathe {
            animation: breathe 3s ease-in-out infinite;
        }
        @keyframes wag {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(18deg); }
        }
        .animate-wag {
            transform-origin: 30px 170px;
            animation: wag 0.35s ease-in-out infinite;
        }
        @keyframes barkBounce {
            0%, 100% { transform: scale(1) translateY(0); }
            25% { transform: scale(1.08) translateY(-10px) rotate(-3deg); }
            75% { transform: scale(1.08) translateY(-10px) rotate(3deg); }
        }
        .animate-bark {
            animation: barkBounce 0.25s ease-in-out infinite;
        }
        @keyframes floatZ {
            0% { opacity: 0; transform: translateY(0px) scale(0.7); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
        }
        .zzz {
            animation: floatZ 2s linear infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 sm:p-6 text-stone-800">

    <header class="text-center mt-2">
        <div class="inline-block bg-amber-100 border border-amber-300 rounded-full px-4 py-1 text-sm font-semibold text-amber-800 mb-2 shadow-sm">
            🐾 2.5kg 말티프 공부 지킴이
        </div>
        <h1 class="jua-font text-3xl sm:text-4xl text-amber-900 tracking-wide drop-shadow-sm">
            열공 지킴이 댕댕이
        </h1>
        <p class="text-xs sm:text-sm text-stone-600 mt-1">
            공부하다가 눈을 감고 졸면 리얼한 짖는 소리로 깨워드려요!
        </p>
    </header>

    <main class="w-full max-w-md bg-white/85 backdrop-blur-md rounded-3xl shadow-xl p-6 my-4 border border-amber-200 flex flex-col items-center relative overflow-hidden">
        
        <!-- Hidden webcam elements as requested -->
        <video id="webcam" class="hidden" playsinline></video>
        <canvas id="output_canvas" class="hidden"></canvas>

        <!-- Status Badge -->
        <div id="status-badge" class="flex items-center gap-2 bg-emerald-100 text-emerald-800 px-4 py-1.5 rounded-full text-sm font-medium transition-all duration-300 shadow-sm mb-6">
            <span id="status-dot" class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="status-text">모니터링 대기 중 (시작 버튼을 누르세요)</span>
        </div>

        <!-- MALTESE CHARACTER ARTWORK BASED ON PHOTO -->
        <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center my-2">
            <!-- Warm Study Glow Effect -->
            <div class="absolute inset-0 bg-amber-100/60 rounded-full filter blur-2xl -z-10"></div>
            
            <!-- Sleep Zzz Container -->
            <div id="zzz-container" class="absolute top-2 right-8 pointer-events-none hidden z-20">
                <span class="absolute zzz text-amber-700 font-bold text-lg" style="animation-delay: 0s;">Z</span>
                <span class="absolute zzz text-amber-600 font-bold text-2xl" style="animation-delay: 0.7s; right: -14px; top: 12px;">Z</span>
                <span class="absolute zzz text-amber-500 font-bold text-3xl" style="animation-delay: 1.4s; right: -28px; top: 28px;">Z</span>
            </div>

            <!-- SVG Maltese Character Artwork matching user's photo features -->
            <svg id="dog-svg" viewBox="0 0 300 300" class="w-full h-full animate-breathe drop-shadow-xl transition-transform duration-200">
                <defs>
                    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
                        <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#78350f" flood-opacity="0.18"/>
                    </filter>
                    <linearGradient id="malteseFur" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#dfb186"/>
                        <stop offset="100%" stop-color="#b88359"/>
                    </linearGradient>
                    <linearGradient id="malteseLightFur" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#f5e1ce"/>
                        <stop offset="100%" stop-color="#dfb186"/>
                    </linearGradient>
                </defs>

                <g filter="url(#dropShadow)">
                    <!-- Tail -->
                    <g id="dog-tail" class="animate-wag">
                        <path d="M 45 180 Q 20 150 25 125 Q 30 110 45 125 Q 60 150 55 175 Z" fill="url(#malteseFur)" />
                    </g>

                    <!-- Paws -->
                    <ellipse cx="110" cy="245" rx="16" ry="12" fill="url(#malteseFur)" />
                    <ellipse cx="180" cy="245" rx="16" ry="12" fill="url(#malteseFur)" />

                    <!-- Body -->
                    <path d="M 95 160 Q 85 220 115 240 Q 145 250 170 240 Q 195 220 190 160 Q 190 130 145 130 Q 100 130 95 160 Z" fill="url(#malteseFur)" />
                    
                    <!-- Fluffy Chest Patch -->
                    <path d="M 120 170 Q 145 190 165 170 Q 180 205 145 220 Q 110 205 120 170 Z" fill="#fffaf5" opacity="0.95"/>
                </g>

                <!-- Head Group -->
                <g id="dog-head" filter="url(#dropShadow)" class="transition-transform duration-300">
                    <!-- Left Ear (Fluffy drooping maltipoo ear) -->
                    <path d="M 80 100 Q 50 105 45 135 Q 40 165 65 155 Q 85 140 90 115 Z" fill="#9c6d48" />
                    <!-- Right Ear -->
                    <path d="M 210 100 Q 240 105 245 135 Q 250 165 225 155 Q 205 140 200 115 Z" fill="#9c6d48" />

                    <!-- Main Fluffy Head Base -->
                    <circle cx="145" cy="115" r="58" fill="url(#malteseLightFur)" />
                    <circle cx="115" cy="110" r="32" fill="url(#malteseFur)" />
                    <circle cx="175" cy="110" r="32" fill="url(#malteseFur)" />
                    <circle cx="145" cy="95" r="38" fill="url(#malteseFur)" />

                    <!-- Forehead Tuft (matching the photo's cute center cowlick) -->
                    <path d="M 135 68 Q 145 52 155 68 Q 160 82 145 82 Q 130 82 135 68 Z" fill="#f5e1ce" />

                    <!-- Eyes & Expression Group -->
                    <g id="dog-eyes">
                        <!-- Open Eyes (Default) -->
                        <g id="eyes-open">
                            <!-- Left Eye -->
                            <ellipse cx="123" cy="113" rx="7.5" ry="8.5" fill="#111" />
                            <circle cx="125" cy="111" r="2.5" fill="white" />
                            <circle cx="121" cy="116" r="1" fill="white" opacity="0.8" />
                            <!-- Right Eye -->
                            <ellipse cx="167" cy="113" rx="7.5" ry="8.5" fill="#111" />
                            <circle cx="169" cy="111" r="2.5" fill="white" />
                            <circle cx="165" cy="116" r="1" fill="white" opacity="0.8" />
                        </g>

                        <!-- Closed Eyes (Sleeping/Blinking) -->
                        <g id="eyes-closed" class="hidden">
                            <path d="M 115 113 Q 123 122 131 113" stroke="#1c1917" stroke-width="3" stroke-linecap="round" fill="none" />
                            <path d="M 159 113 Q 167 122 175 113" stroke="#1c1917" stroke-width="3" stroke-linecap="round" fill="none" />
                        </g>
                    </g>

                    <!-- Cute Button Nose -->
                    <ellipse cx="145" cy="130" rx="8.5" ry="6.5" fill="#1c1917" />
                    <ellipse cx="143" cy="128" rx="2.5" ry="1.5" fill="#78716c" opacity="0.8" />

                    <!-- Snout & Mouth -->
                    <path d="M 145 136.5 L 145 146" stroke="#44403c" stroke-width="2.5" stroke-linecap="round" />
                    <!-- Happy Smile / Barking Mouth -->
                    <path id="dog-smile" d="M 133 146 Q 145 156 157 146" stroke="#44403c" stroke-width="2.5" stroke-linecap="round" fill="none" />
                    <path id="dog-bark-mouth" d="M 136 146 Q 145 166 154 146 Z" fill="#e11d48" class="hidden" />
                    <path id="dog-sleep-mouth" d="M 137 148 Q 145 152 153 148" stroke="#44403c" stroke-width="2" stroke-linecap="round" fill="none" class="hidden" />

                    <!-- Cute Tongue when awake/alert -->
                    <path id="dog-tongue" d="M 141 152 Q 145 163 149 152 Z" fill="#f43f5e" />
                </g>
            </svg>
        </div>

        <!-- Alert Notification Box -->
        <div id="alert-banner" class="hidden w-full bg-rose-50 border-2 border-rose-400 text-rose-700 px-4 py-3 rounded-2xl text-center font-bold mb-4 animate-bounce shadow-md">
            🚨 멍멍! 멍멍! 주인님 눈 감고 졸지 마세요! 정신 차리세요! 🐾
        </div>

        <!-- Controls -->
        <div class="flex gap-3 w-full">
            <button id="start-btn" onclick="startMonitoring()" class="flex-1 bg-amber-600 hover:bg-amber-700 active:scale-95 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 text-base">
                <span>🛡️ 지키기 시작</span>
            </button>
            <button id="stop-btn" onclick="stopMonitoring()" disabled class="flex-1 bg-stone-200 text-stone-400 font-bold py-3.5 px-6 rounded-2xl transition-all flex items-center justify-center gap-2 text-base cursor-not-allowed">
                <span>⏸️ 중지</span>
            </button>
        </div>
    </main>

    <footer class="text-center text-xs text-stone-500 max-w-sm mb-2">
        <p>💡 웹캠은 사용자 모니터링에만 사용되며 화면에 표시되지 않습니다. 프라이버시가 완벽히 보호됩니다.</p>
    </footer>

    <script>
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const statusBadge = document.getElementById('status-badge');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const alertBanner = document.getElementById('alert-banner');
        const zzzContainer = document.getElementById('zzz-container');
        
        // Dog visual elements
        const eyesOpen = document.getElementById('eyes-open');
        const eyesClosed = document.getElementById('eyes-closed');
        const dogSmile = document.getElementById('dog-smile');
        const dogBarkMouth = document.getElementById('dog-bark-mouth');
        const dogSleepMouth = document.getElementById('dog-sleep-mouth');
        const dogTongue = document.getElementById('dog-tongue');
        const dogSvg = document.getElementById('dog-svg');

        let videoElement = document.getElementById('webcam');
        let canvasElement = document.getElementById('output_canvas');
        let faceMesh = null;
        let camera = null;
        let isRunning = false;

        // Sleep tracking variables
        let eyesClosedStartTime = null;
        const SLEEP_THRESHOLD_SECONDS = 2.0; 
        let isUserSleeping = false;
        let lastBarkTime = 0;

        // Real Dog Bark Sound Synthesizer using Web Audio API
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Synthesize authentic dog barking sound ("멍! 멍!") with realistic frequency pitch & noise envelope
        function playRealisticDogBark() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                
                // Play double bark sound sequence ("멍! 멍!")
                executeBark(now, 480, 220);
                executeBark(now + 0.28, 440, 200);
            } catch (e) {
                console.log("Audio playback error:", e);
            }
        }

        function executeBark(startTime, startFreq, endFreq) {
            // Main voice oscillator
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'sawtooth'; // Rich harmonic texture for animal voice
            osc.frequency.setValueAtTime(startFreq, startTime);
            osc.frequency.exponentialRampToValueAtTime(endFreq, startTime + 0.18);

            // Volume envelope
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(0.7, startTime + 0.04);
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.22);

            // Lowpass filter to muffle harsh oscillator buzz into natural warmth
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200, startTime);
            filter.frequency.linearRampToValueAtTime(600, startTime + 0.22);

            osc.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start(startTime);
            osc.stop(startTime + 0.22);
        }

        // Set Dog UI state (awake vs sleeping vs barking)
        function setDogState(sleeping, barking = false) {
            isUserSleeping = sleeping;

            if (barking) {
                // Barking alert state
                eyesOpen.classList.remove('hidden');
                eyesClosed.classList.add('hidden');
                dogSmile.classList.add('hidden');
                dogBarkMouth.classList.remove('hidden');
                dogSleepMouth.classList.add('hidden');
                dogTongue.classList.remove('hidden');
                zzzContainer.classList.add('hidden');
                dogSvg.classList.add('animate-bark');
                dogSvg.classList.remove('animate-breathe');
            } else if (sleeping) {
                // Sleeping state (mirrors user)
                eyesOpen.classList.add('hidden');
                eyesClosed.classList.remove('hidden');
                dogSmile.classList.add('hidden');
                dogBarkMouth.classList.add('hidden');
                dogSleepMouth.classList.remove('hidden');
                dogTongue.classList.add('hidden');
                zzzContainer.classList.remove('hidden');
                dogSvg.classList.remove('animate-bark');
                dogSvg.classList.remove('animate-breathe');
            } else {
                // Alert / Normal state
                eyesOpen.classList.remove('hidden');
                eyesClosed.classList.add('hidden');
                dogSmile.classList.remove('hidden');
                dogBarkMouth.classList.add('hidden');
                dogSleepMouth.classList.add('hidden');
                dogTongue.classList.remove('hidden');
                zzzContainer.classList.add('hidden');
                dogSvg.classList.remove('animate-bark');
                dogSvg.classList.add('animate-breathe');
            }
        }

        // Calculate Eye Openness via MediaPipe FaceMesh landmarks
        function calculateEyeOpenness(landmarks) {
            const leftUpper = landmarks[159];
            const leftLower = landmarks[145];
            const leftOuter = landmarks[33];
            const leftInner = landmarks[133];

            const rightUpper = landmarks[386];
            const rightLower = landmarks[374];
            const rightOuter = landmarks[263];
            const rightInner = landmarks[362];

            if (!leftUpper || !leftLower || !rightUpper || !rightLower) return 1.0;

            const leftVertical = Math.hypot(leftUpper.x - leftLower.x, leftUpper.y - leftLower.y);
            const leftHorizontal = Math.hypot(leftOuter.x - leftInner.x, leftOuter.y - leftInner.y);
            
            const rightVertical = Math.hypot(rightUpper.x - rightLower.x, rightUpper.y - rightLower.y);
            const rightHorizontal = Math.hypot(rightOuter.x - rightInner.x, rightOuter.y - rightInner.y);

            return ((leftVertical / leftHorizontal) + (rightVertical / rightHorizontal)) / 2.0;
        }

        // MediaPipe Results Callback
        function onResults(results) {
            if (!isRunning) return;

            if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
                statusBadge.className = "flex items-center gap-2 bg-amber-100 text-amber-800 px-4 py-1.5 rounded-full text-sm font-medium transition-all duration-300 shadow-sm mb-6";
                statusDot.className = "w-3 h-3 rounded-full bg-amber-500";
                statusText.innerText = "사용자 얼굴을 찾는 중...";
                return;
            }

            const landmarks = results.multiFaceLandmarks[0];
            const eyeRatio = calculateEyeOpenness(landmarks);
            const CLOSED_THRESHOLD = 0.18;

            if (eyeRatio < CLOSED_THRESHOLD) {
                if (!eyesClosedStartTime) {
                    eyesClosedStartTime = Date.now();
                }

                const elapsedSeconds = (Date.now() - eyesClosedStartTime) / 1000;

                if (elapsedSeconds >= SLEEP_THRESHOLD_SECONDS) {
                    // User is asleep -> Dog barks and alerts!
                    setDogState(true, true);
                    alertBanner.classList.remove('hidden');

                    statusBadge.className = "flex items-center gap-2 bg-rose-100 text-rose-800 px-4 py-1.5 rounded-full text-sm font-medium transition-all duration-300 shadow-sm mb-6 animate-pulse";
                    statusDot.className = "w-3 h-3 rounded-full bg-rose-500 animate-ping";
                    statusText.innerText = "조는 중 포착! 댕댕이가 짖어 깨우는 중!";

                    const now = Date.now();
                    if (now - lastBarkTime > 1600) {
                        playRealisticDogBark();
                        lastBarkTime = now;
                    }
                } else {
                    // Just closed eyes momentarily (blinking or nodding off)
                    setDogState(true, false);
                    alertBanner.classList.add('hidden');
                    statusBadge.className = "flex items-center gap-2 bg-amber-100 text-amber-800 px-4 py-1.5 rounded-full text-sm font-medium transition-all duration-300 shadow-sm mb-6";
                    statusDot.className = "w-3 h-3 rounded-full bg-amber-500 animate-pulse";
                    statusText.innerText = "눈 감음 감지 중... (" + elapsedSeconds.toFixed(1) + "초)";
                }
            } else {
                // Eyes open and alert
                eyesClosedStartTime = null;
                setDogState(false, false);
                alertBanner.classList.add('hidden');

                statusBadge.className = "flex items-center gap-2 bg-emerald-100 text-emerald-800 px-4 py-1.5 rounded-full text-sm font-medium transition-all duration-300 shadow-sm mb-6";
                statusDot.className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
                statusText.innerText = "말티프 댕댕이가 열심히 지켜보는 중 👀✨";
            }
        }

        async function startMonitoring() {
            initAudio();
            try {
                statusText.innerText = "웹캠 연결 중...";
                
                faceMesh = new FaceMesh({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
                });

                faceMesh.setOptions({
                    maxNumFaces: 1,
                    refineLandmarks: true,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                faceMesh.onResults(onResults);

                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        if (isRunning) {
                            await faceMesh.send({ image: videoElement });
                        }
                    },
                    width: 640,
                    height: 480
                });

                await camera.start();
                isRunning = true;

                startBtn.disabled = true;
                startBtn.classList.add('bg-stone-300', 'cursor-not-allowed');
                startBtn.classList.remove('bg-amber-600', 'hover:bg-amber-700');

                stopBtn.disabled = false;
                stopBtn.classList.remove('bg-stone-200', 'text-stone-400', 'cursor-not-allowed');
                stopBtn.classList.add('bg-rose-500', 'hover:bg-rose-600', 'text-white', 'shadow-md');

            } catch (err) {
                console.error("Webcam init error:", err);
                statusText.innerText = "웹캠 권한이 거부되었거나 오류가 발생했습니다.";
                alert("웹캠 접근 권한을 허용해 주세요!");
            }
        }

        function stopMonitoring() {
            isRunning = false;
            if (camera) camera.stop();
            if (faceMesh) faceMesh.close();

            setDogState(false, false);
            alertBanner.classList.add('hidden');

            statusBadge.className = "flex items-center gap-2 bg-stone-100 text-stone-700 px-4 py-1.5 rounded-full text-sm font-medium transition-all duration-300 shadow-sm mb-6";
            statusDot.className = "w-3 h-3 rounded-full bg-stone-400";
            statusText.innerText = "모니터링이 중지되었습니다.";

            startBtn.disabled = false;
            startBtn.classList.remove('bg-stone-300', 'cursor-not-allowed');
            startBtn.classList.add('bg-amber-600', 'hover:bg-amber-700');

            stopBtn.disabled = true;
            stopBtn.classList.add('bg-stone-200', 'text-stone-400', 'cursor-not-allowed');
            stopBtn.classList.remove('bg-rose-500', 'hover:bg-rose-600', 'text-white', 'shadow-md');
        }
    </script>
</body>
</html>
