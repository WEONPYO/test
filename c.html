<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>머리 위 손 동작 인식 (O / X 판정)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Hands CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: white;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        .mirror {
            transform: scaleX(-1);
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 35px rgba(255,255,255,0.8)); }
        }
        .animate-big-effect {
            animation: pulse-glow 0.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col h-screen justify-between items-center select-none">

    <!-- 상단 상태 바 -->
    <header class="w-full max-w-md bg-slate-900/85 backdrop-blur-md p-3 flex flex-col items-center z-20 border-b border-slate-700 shadow-lg">
        <h1 class="text-base font-bold text-cyan-400">✋ 머리 위 O / X 제스처 인식</h1>
        <p id="instruction" class="text-xs text-slate-300 mt-0.5 text-center">
            한 손 머리 위 (1초) ➔ <span class="text-green-400 font-bold">O</span> | 두 손 머리 위 (1초) ➔ <span class="text-rose-400 font-bold">X</span>
        </p>
    </header>

    <!-- 메인 카메라 및 오버레이 뷰어 -->
    <main class="relative flex-1 w-full max-w-md flex justify-center items-center overflow-hidden bg-black">
        <!-- 비디오 요소 (숨김 처리 후 캔버스에 드로잉) -->
        <video id="webcam" class="absolute inset-0 w-full h-full object-cover mirror hidden" playsinline></video>
        
        <!-- 미디어파이프 스켈레톤 드로잉 캔버스 -->
        <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover mirror"></canvas>

        <!-- 1초 타이머 진행 바 -->
        <div id="timer-container" class="absolute bottom-20 w-48 h-3 bg-slate-700/70 rounded-full overflow-hidden border border-slate-500 hidden z-20">
            <div id="timer-bar" class="h-full bg-cyan-400 w-0 transition-all duration-75"></div>
        </div>
        <div id="timer-text" class="absolute bottom-24 text-xs font-semibold text-cyan-300 hidden z-20">인식 유지 중...</div>

        <!-- 대형 O / X 결과 표시 오버레이 -->
        <div id="result-overlay" class="absolute inset-0 flex items-center justify-center bg-black/50 backdrop-blur-xs z-30 pointer-events-none opacity-0 transition-opacity duration-300">
            <span id="result-char" class="text-[14rem] font-black tracking-tighter drop-shadow-[0_10px_25px_rgba(0,0,0,0.8)]"></span>
        </div>
    </main>

    <!-- 하단 로그 패널 -->
    <footer class="w-full max-w-md bg-slate-900 p-3 z-20 border-t border-slate-800">
        <div class="flex justify-between items-center text-xs text-slate-400 mb-1">
            <span>실시간 이벤트 로그</span>
            <span id="status-badge" class="px-2 py-0.5 rounded bg-slate-800 text-slate-300">대기 중...</span>
        </div>
        <div id="log-box" class="h-12 bg-slate-950 rounded p-2 text-xs text-cyan-300 overflow-y-auto font-mono">
            [시스템] 카메라를 준비하는 중입니다...
        </div>
    </footer>

    <!-- 로직 스크립트 -->
    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const logBox = document.getElementById('log-box');
        const statusBadge = document.getElementById('status-badge');
        const resultOverlay = document.getElementById('result-overlay');
        const resultChar = document.getElementById('result-char');
        const timerContainer = document.getElementById('timer-container');
        const timerBar = document.getElementById('timer-bar');
        const timerText = document.getElementById('timer-text');

        let holdStartTime = null;
        let currentDetectedType = null; // 'O' 또는 'X'
        let activeEffectTimer = null;
        let coolTimeEnd = 0; // 연속 인식 방지용 쿨타임

        function addLog(message) {
            const timeStr = new Date().toLocaleTimeString();
            logBox.innerHTML = `[${timeStr}] ${message}<br>` + logBox.innerHTML;
        }

        function onResults(results) {
            if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            let handsAboveHeadCount = 0;

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    // 손 스켈레톤 그리기
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#06b6d4', lineWidth: 3});
                    drawLandmarks(canvasCtx, landmarks, {color: '#f43f5e', lineWidth: 1, radius: 3});

                    // 손목(0번) Y 좌표 판정 (0에 가까울수록 화면 상단 = 머리 위)
                    // 화면 상단 42% 이내에 손목이 위치하면 머리 위로 판정
                    const wristY = landmarks[0].y;
                    if (wristY < 0.42) {
                        handsAboveHeadCount++;
                    }
                }
            }

            // 조건 판정: 한 손 머리 위 = O, 두 손 머리 위 = X
            let detectedState = null;
            if (handsAboveHeadCount === 1) {
                detectedState = 'O';
            } else if (handsAboveHeadCount >= 2) {
                detectedState = 'X';
            }

            const now = Date.now();

            // 쿨타임 중이면 타이머 진행 무시
            if (now < coolTimeEnd) {
                canvasCtx.restore();
                return;
            }

            if (detectedState !== null) {
                statusBadge.innerText = `${detectedState} 감지 유지 중...`;
                statusBadge.className = "px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-bold animate-pulse";
                
                timerContainer.classList.remove('hidden');
                timerText.classList.remove('hidden');

                if (currentDetectedType !== detectedState) {
                    currentDetectedType = detectedState;
                    holdStartTime = now;
                } else {
                    const elapsed = now - holdStartTime;
                    const progress = Math.min((elapsed / 1000) * 100, 100); // 1초 기준
                    timerBar.style.width = `${progress}%`;

                    if (elapsed >= 1000) { // 1초 이상 유지 완료
                        triggerBigDisplay(detectedState);
                        coolTimeEnd = now + 2000; // 2초간 쿨타임 부여
                        currentDetectedType = null;
                        holdStartTime = null;
                    }
                }
            } else {
                currentDetectedType = null;
                holdStartTime = null;
                timerContainer.classList.add('hidden');
                timerText.classList.add('hidden');
                timerBar.style.width = '0%';
                statusBadge.innerText = '대기 중...';
                statusBadge.className = "px-2 py-0.5 rounded bg-slate-800 text-slate-300";
            }

            canvasCtx.restore();
        }

        function triggerBigDisplay(type) {
            if (activeEffectTimer) clearTimeout(activeEffectTimer);

            resultChar.innerText = type;
            if (type === 'O') {
                resultChar.className = "text-[14rem] font-black tracking-tighter text-green-400 drop-shadow-[0_0_50px_rgba(74,222,128,0.8)] animate-big-effect";
                addLog("✨ [성공] 한 손 머리 위 1초 유지 -> 대형 O 표시!");
            } else {
                resultChar.className = "text-[14rem] font-black tracking-tighter text-rose-500 drop-shadow-[0_0_50px_rgba(244,63,94,0.8)] animate-big-effect";
                addLog("✨ [성공] 두 손 머리 위 1초 유지 -> 대형 X 표시!");
            }

            // 진동 피드백 (모바일 지원 시)
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
            }

            resultOverlay.classList.remove('opacity-0');

            // 1.5초 후 결과 화면 숨기기
            activeEffectTimer = setTimeout(() => {
                resultOverlay.classList.add('opacity-0');
            }, 1500);
        }

        // MediaPipe Hands 초기화
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        // 카메라 연결
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        camera.start()
            .then(() => {
                addLog("카메라가 성공적으로 실행되었습니다.");
            })
            .catch(err => {
                addLog("카메라 실행 오류: " + err);
                alert("카메라 권한을 허용해야 이용할 수 있습니다.");
            });
    </script>
</body>
</html>
