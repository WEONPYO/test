<!DOCTYPE html>
<html lang="ko" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>머리 위 손 동작 O/X 인식기 (카메라 숨김)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        @keyframes pop-bounce {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.15); opacity: 1; }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes glow-pulse-green {
            0%, 100% { filter: drop-shadow(0 0 25px rgba(74, 222, 128, 0.8)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 60px rgba(74, 222, 128, 1)); transform: scale(1.05); }
        }

        @keyframes glow-pulse-red {
            0%, 100% { filter: drop-shadow(0 0 25px rgba(244, 63, 94, 0.8)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 60px rgba(244, 63, 94, 1)); transform: scale(1.05); }
        }

        .animate-pop {
            animation: pop-bounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .animate-glow-o {
            animation: glow-pulse-green 1.5s infinite ease-in-out;
        }

        .animate-glow-x {
            animation: glow-pulse-red 1.5s infinite ease-in-out;
        }

        /* Hide scrollbars for clean app feel */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-full text-slate-100 flex flex-col justify-between overflow-hidden bg-slate-950">

    <!-- Header -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-5 py-4 flex items-center justify-between shrink-0 z-20 shadow-md">
        <div class="flex items-center space-x-3">
            <div id="status-dot" class="w-3 h-3 bg-amber-500 rounded-full animate-pulse shadow-[0_0_10px_rgba(245,158,11,0.5)]"></div>
            <div>
                <h1 class="text-base font-extrabold tracking-tight text-white flex items-center gap-1.5">
                    <span>🙌 O / X 제스처 인식</span>
                </h1>
                <p class="text-[11px] text-slate-400">카메라 화면 미표시 모드</p>
            </div>
        </div>
        <div id="status-badge" class="px-3 py-1 text-xs font-semibold rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30">
            카메라 대기
        </div>
    </header>

    <!-- Main Interactive Display Zone -->
    <main class="flex-1 relative flex flex-col items-center justify-center p-6 overflow-hidden">

        <!-- Background Ambient Glow -->
        <div id="bg-glow" class="absolute w-96 h-96 rounded-full bg-cyan-600/10 blur-3xl pointer-events-none transition-all duration-700"></div>

        <!-- Center Dynamic Card Status -->
        <div id="main-status-card" class="relative z-10 w-full max-w-sm bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 text-center shadow-2xl flex flex-col items-center justify-center space-y-6 transition-all duration-300">
            
            <div class="w-16 h-16 rounded-2xl bg-slate-800/80 border border-slate-700 flex items-center justify-center text-3xl shadow-inner text-slate-300">
                <span id="center-icon">👋</span>
            </div>

            <div class="space-y-1">
                <h2 id="center-title" class="text-xl font-extrabold text-white">동작을 대기 중입니다</h2>
                <p id="center-desc" class="text-xs text-slate-400 leading-relaxed max-w-xs">
                    한 손 또는 두 손을 머리 위로 들고<br><strong class="text-cyan-400 font-semibold">1초간 유지</strong>해보세요!
                </p>
            </div>

            <!-- Holding Progress Bar & Ring -->
            <div id="progress-container" class="w-full space-y-2 pt-2 opacity-30 transition-opacity duration-300">
                <div class="flex justify-between items-center text-xs font-mono">
                    <span id="progress-state-text" class="text-slate-400 font-sans font-semibold">동작 유지</span>
                    <span id="progress-time-text" class="text-cyan-400 font-bold">0.0s / 1.0s</span>
                </div>
                <div class="w-full h-3 bg-slate-800 rounded-full overflow-hidden border border-slate-700/80 p-0.5">
                    <div id="progress-bar" class="h-full bg-cyan-500 rounded-full w-0 transition-all duration-75 shadow-[0_0_12px_rgba(6,182,212,0.8)]"></div>
                </div>
            </div>

            <!-- Pose Guide Grid -->
            <div class="grid grid-cols-2 gap-3 w-full pt-2">
                <div id="card-guide-o" class="bg-slate-950/60 border border-slate-800 rounded-2xl p-3 text-left transition-all duration-300">
                    <div class="text-xl mb-1">🙆‍♂️</div>
                    <div class="text-xs font-bold text-slate-200">한 손 머리 위</div>
                    <div class="text-[10px] text-emerald-400 font-semibold mt-0.5">➔ 대형 O (1초)</div>
                </div>
                <div id="card-guide-x" class="bg-slate-950/60 border border-slate-800 rounded-2xl p-3 text-left transition-all duration-300">
                    <div class="text-xl mb-1">🙌</div>
                    <div class="text-xs font-bold text-slate-200">두 손 머리 위</div>
                    <div class="text-[10px] text-rose-400 font-semibold mt-0.5">➔ 대형 X (1초)</div>
                </div>
            </div>

        </div>

        <!-- GIANT OVERLAY DISPLAY FOR O / X (FULL SCREEN TRIGGER) -->
        <div id="giant-result-overlay" class="absolute inset-0 z-40 bg-slate-950/80 backdrop-blur-lg flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
            <div id="giant-char" class="text-[180px] sm:text-[240px] font-black leading-none tracking-tighter select-none">
                O
            </div>
            <div id="giant-label" class="mt-4 px-6 py-2 rounded-full text-base font-extrabold tracking-wider uppercase border shadow-2xl">
                한 손 감지 완료!
            </div>
        </div>

        <!-- Initial Permission Modal -->
        <div id="start-modal" class="absolute inset-0 z-50 bg-slate-950/95 flex flex-col items-center justify-center p-6 text-center">
            <div class="w-20 h-20 rounded-3xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-4xl text-cyan-400 mb-6 shadow-[0_0_30px_rgba(6,182,212,0.2)]">
                📷
            </div>
            <h2 class="text-2xl font-black text-white mb-2 tracking-tight">제스처 인식 시작하기</h2>
            <p class="text-xs sm:text-sm text-slate-400 max-w-xs mb-8 leading-relaxed">
                카메라 화면은 <strong class="text-white">화면에 전혀 표시되지 않으며</strong> 백그라운드에서 안전하게 손 모양만 감지합니다.
            </p>
            <button id="start-btn" class="w-full max-w-xs bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-white font-bold py-4 px-8 rounded-2xl shadow-lg shadow-cyan-600/30 transition-all text-sm tracking-wide">
                카메라 켜고 시작하기
            </button>
        </div>

    </main>

    <!-- Footer Event Log Section -->
    <footer class="bg-slate-900/90 border-t border-slate-800 p-4 shrink-0 z-20 shadow-lg">
        <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center space-x-1.5">
                <span class="w-2 h-2 rounded-full bg-cyan-500"></span>
                <span>실시간 감지 로그</span>
            </span>
            <button id="clear-log-btn" class="text-[11px] text-slate-500 hover:text-slate-300 underline transition-colors">로그 지우기</button>
        </div>
        <div id="log-container" class="bg-slate-950 border border-slate-800/80 rounded-xl p-3 h-20 overflow-y-auto no-scrollbar font-mono text-[11px] text-slate-400 space-y-1">
            <div class="text-slate-500">[안내] 시작하기 버튼을 눌러 동작 인식을 실행하세요.</div>
        </div>
    </footer>

    <!-- HIDDEN CAMERA & CANVAS (COMPLETELY INVISIBLE FROM UI) -->
    <video id="hidden-webcam" class="hidden" playsinline style="display: none; visibility: hidden; width: 0; height: 0;"></video>
    <canvas id="hidden-canvas" class="hidden" style="display: none; visibility: hidden; width: 0; height: 0;"></canvas>

    <!-- Application Logic Script -->
    <script>
        // DOM References
        const webcamElement = document.getElementById('hidden-webcam');
        const startModal = document.getElementById('start-modal');
        const startBtn = document.getElementById('start-btn');
        const statusBadge = document.getElementById('status-badge');
        const statusDot = document.getElementById('status-dot');
        
        const centerIcon = document.getElementById('center-icon');
        const centerTitle = document.getElementById('center-title');
        const centerDesc = document.getElementById('center-desc');
        const bgGlow = document.getElementById('bg-glow');

        const progressContainer = document.getElementById('progress-container');
        const progressStateText = document.getElementById('progress-state-text');
        const progressTimeText = document.getElementById('progress-time-text');
        const progressBar = document.getElementById('progress-bar');

        const cardGuideO = document.getElementById('card-guide-o');
        const cardGuideX = document.getElementById('card-guide-x');

        const giantResultOverlay = document.getElementById('giant-result-overlay');
        const giantChar = document.getElementById('giant-char');
        const giantLabel = document.getElementById('giant-label');

        const logContainer = document.getElementById('log-container');
        const clearLogBtn = document.getElementById('clear-log-btn');

        // State Variables
        let cameraInstance = null;
        let holdStartTime = null;
        let currentDetectedGesture = null; // 'ONE_HAND' or 'TWO_HANDS'
        let cooldownUntil = 0; // Timestamp for 2-second cooldown
        const REQUIRED_HOLD_DURATION_MS = 1000; // 1 Second hold requirement
        let hideOverlayTimeout = null;

        // Sound Synthesis (Web Audio API for trigger sounds)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'O') {
                    // High cheerful chime sound for O
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.3); // C6
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'X') {
                    // Dual tone buzz/saw sound for X
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now); // A3
                    osc.frequency.setValueAtTime(164.81, now + 0.15); // E3
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch (e) {
                console.warn('Audio playback not permitted yet:', e);
            }
        }

        function addLog(message, type = 'info') {
            const timeStr = new Date().toLocaleTimeString();
            const logItem = document.createElement('div');
            let colorClass = 'text-slate-400';

            if (type === 'success-o') colorClass = 'text-emerald-400 font-semibold';
            if (type === 'success-x') colorClass = 'text-rose-400 font-semibold';
            if (type === 'warn') colorClass = 'text-amber-400';

            logItem.className = `${colorClass} truncate`;
            logItem.textContent = `[${timeStr}] ${message}`;
            logContainer.prepend(logItem);

            if (logContainer.children.length > 25) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        clearLogBtn.addEventListener('click', () => {
            logContainer.innerHTML = '<div class="text-slate-500">[로그가 초기화되었습니다.]</div>';
        });

        // MediaPipe Results Handler
        function onResults(results) {
            const now = Date.now();

            // Ignore processing if in cooldown period
            if (now < cooldownUntil) {
                const remainingCooldown = Math.ceil((cooldownUntil - now) / 1000);
                statusBadge.textContent = `쿨타임 중 (${remainingCooldown}s)`;
                statusBadge.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-purple-500/10 text-purple-400 border border-purple-500/30';
                statusDot.className = 'w-3 h-3 bg-purple-500 rounded-full animate-pulse';
                
                // Reset progress UI during cooldown
                progressBar.style.width = '0%';
                progressContainer.classList.add('opacity-30');
                return;
            }

            let handsAboveHeadCount = 0;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (const landmarks of results.multiHandLandmarks) {
                    // Wrist landmark (Index 0) - y coordinate < 0.42 means upper region of frame
                    const wristY = landmarks[0].y;
                    if (wristY < 0.42) {
                        handsAboveHeadCount++;
                    }
                }
            }

            // Determine detected pose state
            let detectedPose = null;
            if (handsAboveHeadCount === 1) {
                detectedPose = 'ONE_HAND';
            } else if (handsAboveHeadCount >= 2) {
                detectedPose = 'TWO_HANDS';
            }

            if (detectedPose !== null) {
                // Pose is currently active
                if (currentDetectedGesture !== detectedPose) {
                    currentDetectedGesture = detectedPose;
                    holdStartTime = now;
                }

                const elapsed = now - holdStartTime;
                const progressRatio = Math.min(1, elapsed / REQUIRED_HOLD_DURATION_MS);
                const secondsText = (Math.min(1000, elapsed) / 1000).toFixed(1);

                // Update UI Progress
                progressContainer.classList.remove('opacity-30');
                progressBar.style.width = `${progressRatio * 100}%`;
                progressTimeText.textContent = `${secondsText}s / 1.0s`;

                if (detectedPose === 'ONE_HAND') {
                    statusBadge.textContent = '한 손 머리 위 유지 중...';
                    statusBadge.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 animate-pulse';
                    statusDot.className = 'w-3 h-3 bg-emerald-400 rounded-full animate-ping';

                    progressBar.className = 'h-full bg-emerald-400 rounded-full w-0 transition-all duration-75 shadow-[0_0_12px_rgba(52,211,153,0.8)]';
                    progressStateText.textContent = '⭕ O 동작 감지 중';
                    progressStateText.className = 'text-emerald-400 font-sans font-semibold';

                    cardGuideO.className = 'bg-emerald-950/40 border border-emerald-500/50 rounded-2xl p-3 text-left transition-all duration-300 shadow-lg shadow-emerald-500/10';
                    cardGuideX.className = 'bg-slate-950/60 border border-slate-800 rounded-2xl p-3 text-left transition-all duration-300 opacity-40';

                    centerIcon.textContent = '🙆‍♂️';
                    centerTitle.textContent = '한 손 감지 중...';
                    centerDesc.innerHTML = '조금만 더 유지하면 <strong class="text-emerald-400">O</strong>가 완성됩니다!';
                    bgGlow.className = 'absolute w-96 h-96 rounded-full bg-emerald-500/20 blur-3xl pointer-events-none transition-all duration-500';

                } else if (detectedPose === 'TWO_HANDS') {
                    statusBadge.textContent = '두 손 머리 위 유지 중...';
                    statusBadge.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/40 animate-pulse';
                    statusDot.className = 'w-3 h-3 bg-rose-400 rounded-full animate-ping';

                    progressBar.className = 'h-full bg-rose-500 rounded-full w-0 transition-all duration-75 shadow-[0_0_12px_rgba(244,63,94,0.8)]';
                    progressStateText.textContent = '❌ X 동작 감지 중';
                    progressStateText.className = 'text-rose-400 font-sans font-semibold';

                    cardGuideX.className = 'bg-rose-950/40 border border-rose-500/50 rounded-2xl p-3 text-left transition-all duration-300 shadow-lg shadow-rose-500/10';
                    cardGuideO.className = 'bg-slate-950/60 border border-slate-800 rounded-2xl p-3 text-left transition-all duration-300 opacity-40';

                    centerIcon.textContent = '🙌';
                    centerTitle.textContent = '두 손 감지 중...';
                    centerDesc.innerHTML = '조금만 더 유지하면 <strong class="text-rose-400">X</strong>가 완성됩니다!';
                    bgGlow.className = 'absolute w-96 h-96 rounded-full bg-rose-500/20 blur-3xl pointer-events-none transition-all duration-500';
                }

                // Trigger Event when hold time >= 1 second
                if (elapsed >= REQUIRED_HOLD_DURATION_MS) {
                    triggerGestureResult(detectedPose);
                }

            } else {
                // Reset Pose State
                currentDetectedGesture = null;
                holdStartTime = null;

                progressContainer.classList.add('opacity-30');
                progressBar.style.width = '0%';
                progressTimeText.textContent = '0.0s / 1.0s';
                progressStateText.textContent = '동작 대기';
                progressStateText.className = 'text-slate-400 font-sans font-semibold';

                statusBadge.textContent = '인식 대기 중';
                statusBadge.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30';
                statusDot.className = 'w-3 h-3 bg-cyan-400 rounded-full animate-pulse';

                cardGuideO.className = 'bg-slate-950/60 border border-slate-800 rounded-2xl p-3 text-left transition-all duration-300';
                cardGuideX.className = 'bg-slate-950/60 border border-slate-800 rounded-2xl p-3 text-left transition-all duration-300';

                centerIcon.textContent = '👋';
                centerTitle.textContent = '동작을 대기 중입니다';
                centerDesc.innerHTML = '한 손 또는 두 손을 머리 위로 들고<br><strong class="text-cyan-400 font-semibold">1초간 유지</strong>해보세요!';
                bgGlow.className = 'absolute w-96 h-96 rounded-full bg-cyan-600/10 blur-3xl pointer-events-none transition-all duration-700';
            }
        }

        // Trigger Giant Overlay Display
        function triggerGestureResult(type) {
            cooldownUntil = Date.now() + 2000; // 2-second cooldown
            currentDetectedGesture = null;
            holdStartTime = null;

            if (hideOverlayTimeout) clearTimeout(hideOverlayTimeout);

            if (type === 'ONE_HAND') {
                giantChar.textContent = 'O';
                giantChar.className = 'text-[180px] sm:text-[240px] font-black leading-none tracking-tighter text-emerald-400 animate-pop animate-glow-o select-none';
                giantLabel.textContent = '⭕ 한 손 머리 위 (O 판정 완료)';
                giantLabel.className = 'mt-4 px-6 py-2 rounded-full text-xs sm:text-sm font-extrabold tracking-wider uppercase border border-emerald-500/50 bg-emerald-950/80 text-emerald-300 shadow-2xl';

                playSound('O');
                addLog('⭕ [성공] 한 손 머리 위 1초 유지 -> 대형 O 표시!', 'success-o');

            } else if (type === 'TWO_HANDS') {
                giantChar.textContent = 'X';
                giantChar.className = 'text-[180px] sm:text-[240px] font-black leading-none tracking-tighter text-rose-500 animate-pop animate-glow-x select-none';
                giantLabel.textContent = '❌ 두 손 머리 위 (X 판정 완료)';
                giantLabel.className = 'mt-4 px-6 py-2 rounded-full text-xs sm:text-sm font-extrabold tracking-wider uppercase border border-rose-500/50 bg-rose-950/80 text-rose-300 shadow-2xl';

                playSound('X');
                addLog('❌ [성공] 두 손 머리 위 1초 유지 -> 대형 X 표시!', 'success-x');
            }

            // Mobile Vibration Feedback
            if (navigator.vibrate) {
                if (type === 'ONE_HAND') {
                    navigator.vibrate([120]);
                } else {
                    navigator.vibrate([80, 50, 80]);
                }
            }

            // Show Giant Result Overlay
            giantResultOverlay.classList.remove('opacity-0', 'pointer-events-none');

            // Hide after 1.5 seconds
            hideOverlayTimeout = setTimeout(() => {
                giantResultOverlay.classList.add('opacity-0', 'pointer-events-none');
            }, 1500);
        }

        // Initialize MediaPipe Hands
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.65,
            minTrackingConfidence: 0.65
        });

        hands.onResults(onResults);

        // Start Button Camera Handler
        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            startBtn.textContent = '카메라 연결 중...';
            addLog('백그라운드 카메라 연결 요청 중...');

            try {
                cameraInstance = new Camera(webcamElement, {
                    onFrame: async () => {
                        await hands.send({ image: webcamElement });
                    },
                    width: 640,
                    height: 480,
                    facingMode: 'user'
                });

                await cameraInstance.start();

                // Hide Modal
                startModal.classList.add('transition-opacity', 'duration-500', 'opacity-0');
                setTimeout(() => {
                    startModal.style.display = 'none';
                }, 500);

                statusBadge.textContent = '인식 대기 중';
                addLog('카메라 실행 완료. 화면에 비치지 않는 상태로 백그라운드 인식 중입니다.', 'success-o');

            } catch (err) {
                console.error(err);
                addLog(`카메라 오류: ${err.message || '카메라 접근 권한이 거부되었습니다.'}`, 'warn');
                startBtn.disabled = false;
                startBtn.textContent = '다시 시도하기';
                statusBadge.textContent = '연결 실패';
            }
        });
    </script>
</body>
</html>
