<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AI Tennis Scoreboard</title>

  <!-- MediaPipe Pose JS Libraries via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-color: #08120c;
      --card-bg: #102017;
      --team-a-color: #0b4182;
      --team-b-color: #6b1158;
      --line-color: #ffffff;
      --accent-yellow: #ccff00;
      --text-main: #ffffff;
      --panel-border: #234733;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      touch-action: none;
      flex-direction: row;
    }

    @media (orientation: portrait) {
      body {
        flex-direction: column;
      }
    }

    #unauthorized-access {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-color); color: #ff4d4d; flex-direction: column;
      justify-content: center; align-items: center; z-index: 9999; padding: 20px; text-align: center;
    }

    #fs-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-color); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100; padding: 20px; text-align: center;
    }

    #fs-overlay h2 { color: var(--accent-yellow); font-size: 1.6rem; margin-bottom: 20px; letter-spacing: 1px; }

    .btn-fullscreen-start {
      padding: 12px 28px; font-size: 1rem; font-weight: bold;
      background-color: var(--accent-yellow); border: none; border-radius: 8px;
      color: #000; cursor: pointer; box-shadow: 0 4px 15px rgba(204,255,0,0.3);
      transition: transform 0.2s, background-color 0.2s;
    }
    .btn-fullscreen-start:active { transform: scale(0.96); }

    .main-app {
      flex: 1; display: flex; flex-direction: column; height: 100%; width: 100%; position: relative; overflow: hidden;
    }

    /* 점수판 레이아웃 - 가로모드 컴팩트화 */
    .scoreboard { display: flex; padding: 6px 8px 0 8px; gap: 8px; height: 65%; }

    .team-card {
      flex: 1; border-radius: 10px; padding: 8px 10px; display: flex;
      flex-direction: column; justify-content: space-between; position: relative;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6); overflow: hidden; border: 1px solid rgba(255,255,255,0.15);
    }

    .team-card.team-a { background: linear-gradient(135deg, var(--team-a-color), #051a36); }
    .team-card.team-b { background: linear-gradient(135deg, var(--team-b-color), #2d0725); }

    .team-header { display: flex; justify-content: space-between; align-items: center; z-index: 2; }
    .team-info { display: flex; align-items: center; gap: 6px; }
    .team-title-row { display: flex; align-items: center; gap: 4px; }
    .team-name { font-size: 0.95rem; font-weight: 800; }
    .player-names { font-size: 0.72rem; opacity: 0.85; margin-top: 1px; }

    .court-arrow {
      font-size: 0.75rem; font-weight: 900; color: var(--accent-yellow);
      background: rgba(0, 0, 0, 0.4); padding: 1px 4px; border-radius: 3px;
      border: 1px solid rgba(204, 255, 0, 0.4);
    }

    .sets-won {
      font-size: 0.9rem; font-weight: 700; background: rgba(0,0,0,0.3);
      padding: 3px 8px; border-radius: 5px;
    }

    .score-body {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex; justify-content: center; align-items: center;
      z-index: 1; pointer-events: none;
    }

    .games-score {
      font-size: 0.8rem; font-weight: 700; opacity: 0.95; position: absolute; left: 10px; bottom: 8px;
      background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; z-index: 4;
    }

    .point-score {
      font-size: min(32vw, 34vh);
      font-weight: 900;
      text-shadow: 4px 4px 16px rgba(0,0,0,0.9);
      line-height: 0.8;
      text-align: center;
      display: flex; align-items: center; justify-content: center;
      letter-spacing: -2px; margin: 0; padding: 0;
      transform: translateY(-2%);
    }

    .serve-ball {
      display: inline-block; width: 10px; height: 10px;
      background-color: var(--accent-yellow); border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-yellow); visibility: hidden;
    }
    .serve-ball.active { visibility: visible; }

    .btn-score-up {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer; z-index: 3;
    }

    /* 사이드바 메뉴 컴팩트화 (가로모드 대응) */
    .sidebar-controls {
      display: flex; width: 68px; background-color: var(--card-bg);
      border-left: 1px solid var(--panel-border); padding: 6px 4px; flex-direction: column; gap: 4px;
      justify-content: space-between; align-items: center; z-index: 90;
    }

    .menu-group-main, .menu-group-bottom {
      display: flex; flex-direction: column; gap: 4px; width: 100%; align-items: center;
    }

    /* 컴팩트 아이콘 버튼 스타일 */
    .btn-icon-menu {
      width: 100%; height: 44px; background: #14261c; border: 1px solid #2e5941;
      border-radius: 8px; color: #d0d0d0; display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 1px; cursor: pointer;
      transition: all 0.15s ease; position: relative; padding: 2px 0;
    }

    .btn-icon-menu svg { width: 17px; height: 17px; fill: currentColor; }
    .btn-icon-menu span { font-size: 0.55rem; font-weight: 700; letter-spacing: -0.2px; }

    .btn-icon-menu:active { transform: scale(0.94); background: #1c3829; }

    .btn-icon-menu.active-camera {
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
      background: #183321;
    }

    .btn-icon-menu.active-camera::after {
      content: ''; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px;
      background-color: var(--accent-yellow); border-radius: 50%;
      box-shadow: 0 0 6px var(--accent-yellow);
      animation: pulse-ring 1.5s infinite;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.4; }
      100% { transform: scale(0.8); opacity: 1; }
    }

    .btn-icon-menu.danger {
      color: #ff6b6b; border-color: #592e2e; background: #261414;
    }

    /* 세로 모드 대응 레이아웃 */
    @media (orientation: portrait) {
      .sidebar-controls {
        width: 100%; height: 56px; border-left: none; border-top: 1px solid var(--panel-border);
        flex-direction: row; padding: 4px 8px; gap: 4px;
      }
      .menu-group-main, .menu-group-bottom {
        flex-direction: row; width: auto; flex: 1; gap: 4px;
      }
      .btn-icon-menu { height: 46px; }
    }

    /* 테니스 코트 영역 */
    .court-section {
      display: flex; justify-content: center; align-items: center;
      padding: 2px; position: relative; height: 35%;
    }

    .court-container {
      width: 96%; height: 92%; max-width: 800px; position: relative;
      display: flex; justify-content: center; align-items: center; perspective: 400px;
    }

    .court-inner {
      width: 100%; height: 100%; border: 3px solid var(--line-color);
      position: relative; display: flex; overflow: visible;
      box-shadow: 0 6px 16px rgba(0,0,0,0.8); transition: transform 0.5s ease;
      transform: rotateX(20deg); transform-style: preserve-3d; border-radius: 4px;
    }

    .court-side { position: absolute; top: 0; bottom: 0; width: 50%; transition: background-color 0.3s ease; }
    .court-side.left { left: 0; }
    .court-side.right { right: 0; }

    .bg-team-a { background-color: var(--team-a-color) !important; }
    .bg-team-b { background-color: var(--team-b-color) !important; }

    .net-line {
      position: absolute; left: 50%; top: -4%; bottom: -4%; width: 4px;
      background-color: var(--line-color); transform: translateX(-50%); z-index: 3;
      box-shadow: 0 0 6px rgba(255,255,255,0.8);
    }

    .singles-line-top { position: absolute; top: 15%; left: 0; right: 0; height: 2px; background-color: var(--line-color); z-index: 2; }
    .singles-line-bottom { position: absolute; bottom: 15%; left: 0; right: 0; height: 2px; background-color: var(--line-color); z-index: 2; }
    .service-line-left { position: absolute; left: 25%; top: 15%; bottom: 15%; width: 2px; background-color: var(--line-color); z-index: 2; }
    .service-line-right { position: absolute; right: 25%; top: 15%; bottom: 15%; width: 2px; background-color: var(--line-color); z-index: 2; }
    .center-service-line { position: absolute; top: 50%; left: 25%; right: 25%; height: 2px; background-color: var(--line-color); transform: translateY(-50%); z-index: 2; }
    .hash-left { position: absolute; left: 0; top: 50%; width: 6px; height: 2px; background-color: var(--line-color); transform: translateY(-50%); z-index: 2; }
    .hash-right { position: absolute; right: 0; top: 50%; width: 6px; height: 2px; background-color: var(--line-color); transform: translateY(-50%); z-index: 2; }

    .side-label { position: absolute; font-size: 0.6rem; font-weight: bold; color: rgba(255,255,255,0.8); pointer-events: none; z-index: 4; }
    .side-label.left { left: 4px; top: 1px; }
    .side-label.right { right: 4px; top: 1px; }

    .target-service-box {
      position: absolute; width: 25%; height: 35%;
      background: rgba(204, 255, 0, 0.35); border: 2px dashed var(--accent-yellow);
      z-index: 4; pointer-events: none; transition: all 0.3s ease; box-sizing: border-box;
    }

    .player-marker {
      position: absolute; padding: 2px 4px; border-radius: 4px; font-size: 0.5rem; font-weight: bold;
      color: #fff; box-shadow: 0 3px 6px rgba(0,0,0,0.6); transition: all 0.3s ease; z-index: 5;
      transform: translate(-50%, -50%); white-space: nowrap; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; max-width: 75px;
    }

    .player-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }

    .role-badge {
      font-size: 0.38rem; padding: 1px 2px; border-radius: 2px; background: rgba(0,0,0,0.6);
      color: #fff; margin-top: 1px; font-weight: 800; display: none;
    }
    .role-badge.visible { display: inline-block; }

    .player-marker.server {
      background-color: var(--accent-yellow) !important; color: #000 !important;
      border: 2px solid #000; transform: translate(-50%, -50%) scale(1.1); z-index: 10;
      box-shadow: 0 0 10px var(--accent-yellow);
    }
    .player-marker.server .role-badge { background: #000; color: var(--accent-yellow); }

    .player-marker.receiver {
      border: 2px solid var(--accent-yellow); transform: translate(-50%, -50%) scale(1.05);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
    }
    .player-marker.receiver .role-badge { background: var(--accent-yellow); color: #000; }

    /* 동작 인식 게이지 오버레이 (좌/우 모션) */
    .gesture-gauge-container {
      position: absolute; top: 0; bottom: 0; width: 28px;
      background: rgba(0,0,0,0.5); display: flex; flex-direction: column;
      justify-content: flex-end; z-index: 150; pointer-events: none; opacity: 0;
      transition: opacity 0.2s ease;
    }

    /* 좌/우 게이지 위치 최적화 및 Z-INDEX 보장 */
    .gesture-gauge-container.left { left: 0; border-right: 2px solid rgba(204,255,0,0.4); }
    .gesture-gauge-container.right { right: 0; border-left: 2px solid rgba(204,255,0,0.4); }

    .gesture-gauge-container.active { opacity: 1; }

    .gauge-fill {
      width: 100%; height: 0%; background: linear-gradient(to top, #ccff00, #00ffaa);
      transition: height 0.05s linear; box-shadow: 0 0 10px var(--accent-yellow);
    }

    .gauge-status-text {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-90deg);
      white-space: nowrap; font-size: 0.65rem; font-weight: 900; letter-spacing: 1px;
      color: var(--accent-yellow); text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    .gesture-gauge-container.cooldown .gauge-fill {
      height: 100% !important; background: #ff4d4d !important; opacity: 0.6;
    }
    .gesture-gauge-container.cooldown .gauge-status-text {
      color: #ffffff;
    }

    /* 설정 및 공통 모달 UI - 컴팩트 디자인 */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 200; padding: 10px; overflow-y: auto; }
    .modal-content { background: var(--card-bg); border-radius: 10px; padding: 14px; max-width: 420px; margin: 5px auto; border: 1px solid var(--panel-border); position: relative; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .modal-header h2 { color: var(--accent-yellow); font-size: 1rem; margin: 0; }
    .btn-close-modal { background: transparent; border: none; color: #8b949e; font-size: 1.3rem; font-weight: bold; cursor: pointer; line-height: 1; }
    .modal h3 { color: var(--accent-yellow); font-size: 0.8rem; margin: 10px 0 4px 0; border-top: 1px dashed var(--panel-border); padding-top: 6px; }

    .setting-group { margin-bottom: 8px; }
    .setting-group label { display: block; font-size: 0.7rem; color: #a0a0a0; margin-bottom: 2px; font-weight: 600; }
    .setting-group select, .setting-group input { width: 100%; padding: 5px 7px; border-radius: 5px; border: 1px solid var(--panel-border); background: #0c1911; color: white; font-size: 0.75rem; }
    .input-row { display: flex; gap: 6px; margin-top: 2px; }
    .swipe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

    .btn-save { width: 100%; padding: 10px; background: var(--accent-yellow); border: none; border-radius: 6px; font-weight: bold; color: #000; cursor: pointer; margin-top: 10px; font-size: 0.85rem; }

    .confirm-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); z-index: 250; justify-content: center; align-items: center; padding: 15px; }
    .confirm-box { background: var(--card-bg); border: 1px solid var(--panel-border); border-radius: 10px; padding: 16px; width: 100%; max-width: 300px; text-align: center; }
    .confirm-box p { font-size: 0.85rem; line-height: 1.3; color: #fff; margin-bottom: 14px; }
    .confirm-btns { display: flex; gap: 6px; }
    .confirm-btns button { flex: 1; padding: 8px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; border: none; cursor: pointer; }

    .btn-confirm-yes { background: var(--accent-yellow); color: #000; }
    .btn-confirm-no { background: #1c3829; color: #fff; border: 1px solid var(--panel-border) !important; }

    /* 숨김 처리용 카메라 비디오 및 캔버스 노드 */
    #hidden-video { display: none; visibility: hidden; width: 0; height: 0; position: absolute; }
    #keep-awake-canvas { display: none; width: 1px; height: 1px; position: absolute; pointer-events: none; }
  </style>
</head>
<body>

  <div id="unauthorized-access">
    <h2>Access Denied</h2>
    <p>잘못된 접근입니다.</p>
  </div>

  <div id="fs-overlay">
    <h2>AI TENNIS SCOREBOARD</h2>
    <button class="btn-fullscreen-start" onclick="startFullscreenApp()">전체화면으로 시작하기</button>
  </div>

  <!-- 비디오 영상은 화면상에 표시하지 않음 -->
  <video id="hidden-video" playsinline></video>
  <canvas id="keep-awake-canvas"></canvas>

  <!-- 동작 인식 활성화 시 상태/점수 반영을 보여주는 게이지 (좌측, 우측) -->
  <div class="gesture-gauge-container left" id="gauge-left">
    <div class="gauge-fill" id="gauge-fill-left"></div>
    <div class="gauge-status-text" id="gauge-text-left">1.0s HOLD</div>
  </div>

  <div class="gesture-gauge-container right" id="gauge-right">
    <div class="gauge-fill" id="gauge-fill-right"></div>
    <div class="gauge-status-text" id="gauge-text-right">1.0s HOLD</div>
  </div>

  <div class="main-app">
    <div class="scoreboard" id="scoreboard-container">
      <div class="team-card team-a" id="card-team-a" style="order: 1;">
        <div class="team-header">
          <div class="team-info">
            <span class="serve-ball" id="serve-a"></span>
            <div>
              <div class="team-title-row">
                <span class="team-name">Team A</span>
                <span class="court-arrow" id="arrow-a">◀</span>
              </div>
              <div class="player-names" id="disp-players-a">A. P1 / A. P2</div>
            </div>
          </div>
          <span class="sets-won" id="sets-a">Set: 0</span>
        </div>
        <div class="score-body">
          <div class="point-score" id="points-a">0</div>
        </div>
        <div class="games-score" id="games-a">Game: 0</div>
        <button class="btn-score-up" onclick="addPoint('A')"></button>
      </div>

      <div class="team-card team-b" id="card-team-b" style="order: 2;">
        <div class="team-header">
          <div class="team-info">
            <span class="serve-ball" id="serve-b"></span>
            <div>
              <div class="team-title-row">
                <span class="team-name">Team B</span>
                <span class="court-arrow" id="arrow-b">▶</span>
              </div>
              <div class="player-names" id="disp-players-b">B. P1 / B. P2</div>
            </div>
          </div>
          <span class="sets-won" id="sets-b">Set: 0</span>
        </div>
        <div class="score-body">
          <div class="point-score" id="points-b">0</div>
        </div>
        <div class="games-score" id="games-b">Game: 0</div>
        <button class="btn-score-up" onclick="addPoint('B')"></button>
      </div>
    </div>

    <div class="court-section">
      <div class="court-container">
        <div class="court-inner">
          <div class="court-side left" id="side-left-bg"></div>
          <div class="court-side right" id="side-right-bg"></div>

          <div class="net-line"></div>
          <div class="singles-line-top"></div>
          <div class="singles-line-bottom"></div>
          <div class="service-line-left"></div>
          <div class="service-line-right"></div>
          <div class="center-service-line"></div>
          <div class="hash-left"></div>
          <div class="hash-right"></div>

          <span class="side-label left" id="label-left">TEAM A</span>
          <span class="side-label right" id="label-right">TEAM B</span>

          <div class="target-service-box" id="target-box"></div>

          <div class="player-marker" id="pm-a1"></div>
          <div class="player-marker" id="pm-a2"></div>
          <div class="player-marker" id="pm-b1"></div>
          <div class="player-marker" id="pm-b2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 아이콘 패널 메뉴 레이아웃 (컴팩트화 적용) -->
  <div class="sidebar-controls">
    <div class="menu-group-main">
      <!-- 카메라 모션 인식 토글 버튼 -->
      <button class="btn-icon-menu" id="btn-camera-toggle" onclick="toggleCameraRecognition()" title="Camera Gesture Control">
        <svg viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>CAM</span>
      </button>

      <!-- 서브 팀 전환 버튼 -->
      <button class="btn-icon-menu" id="btn-toggle-serve-s" onclick="toggleServeTeam()" title="Switch Serve Team">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
        <span>SERVE</span>
      </button>

      <!-- 코트 체인지 버튼 -->
      <button class="btn-icon-menu" onclick="manualCourtChange()" title="Change Court Ends">
        <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
        <span>COURT</span>
      </button>

      <!-- 정정 (CORRECT / UNDO) 버튼 -->
      <button class="btn-icon-menu" onclick="undo()" title="Undo Last Point">
        <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 6v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
        <span>CORRECT</span>
      </button>
    </div>

    <div class="menu-group-bottom">

  <div class="confirm-modal" id="custom-confirm-modal">
    <div class="confirm-box">
      <p id="confirm-message">안내문구</p>

        <button class="btn-confirm-yes" id="btn-confirm-yes">확인</button>
        <button class="btn-confirm-no" id="btn-confirm-no">취소</button>
      </div>

  <script>
    function checkDomainAuth() {
      const allowedHost = "weonpyo.github.io";
      if (window.location.hostname !== allowedHost && window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1") {
        const authDiv = document.getElementById('unauthorized-access');
        if (authDiv) authDiv.style.display = 'flex';
        return false;
      }
      return true;
    }

    let config = {
      cameraRes: 'max',
      gestureHoldDuration: 1.0, // 제스처 유지 시간 설정 (초)
      type: 'doubles',
      voiceLang: 'en-GB',
      firstServeTeam: 'A',
      setsToWin: 3,
      gamesPerSet: 6,
      deuceRule: 'ad',
      courtChange: 'manual',
      announceServer: '3000',
      playersA: ['A. P1', 'A. P2'],
      playersB: ['B. P1', 'B. P2'],
      swipes: { up: 'right_score', down: 'left_score', left: 'court_change', right: 'undo' }
    };

    let state = {
      ptsA: 0, ptsB: 0,
      gamesA: 0, gamesB: 0,
      setsA: 0, setsB: 0,
      isTiebreak: false,
      tiebreakFirstServer: null,
      currentServerTeam: 'A',
      courtLeftTeam: 'A'
    };

    let historyStack = [];
    const MAX_HISTORY = 10;
    const pointTerms = ["Love", "Fifteen", "Thirty", "Forty"];

    let wakeLock = null;
    let keepAwakeInterval = null;
    let serverAnnounceTimer = null;
    let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;

    /* MediaPipe Pose AI & Gesture Tracking State */
    let isCameraActive = false;
    let cameraInstance = null;
    let poseInstance = null;

    let gestureStartTime = null;
    let detectedTargetSide = null; // 'left' (왼손만 올림), 'right' (양손 모두 올림)
    let cooldownUntilTime = 0; // 3초간 인식 중지 타임스탬프

    function getActiveServerIndices() {
      const totalGames = (state.setsA + state.setsB) * (config.gamesPerSet * 2) + state.gamesA + state.gamesB;
      const cycle = Math.floor(totalGames / 2);
      return {
        serverIdxA: cycle % 2,
        serverIdxB: cycle % 2
      };
    }

    function cancelServerAnnouncement() {
      if (serverAnnounceTimer) {
        clearTimeout(serverAnnounceTimer);
        serverAnnounceTimer = null;
      }
    }

    function scheduleServerAnnouncement(customDelayMs = null) {
      cancelServerAnnouncement();
      if (config.type !== 'doubles' || config.announceServer === 'off') return;
      const delayMs = customDelayMs !== null ? customDelayMs : parseInt(config.announceServer || '3000', 10);

      serverAnnounceTimer = setTimeout(() => {
        if (config.type !== 'doubles') return;
        const serverTeam = state.currentServerTeam;
        const indices = getActiveServerIndices();
        const activeServerIdx = (serverTeam === 'A') ? indices.serverIdxA : indices.serverIdxB;
        const callText = (activeServerIdx === 0) ? "First server." : "Second server.";
        speak(callText);
        serverAnnounceTimer = null;
      }, delayMs);
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => {
            wakeLock = null;
          });
        }
      } catch (err) {
        console.warn("Screen Wake Lock unavailable or denied:", err);
      }
      startCanvasHeartbeatFallback();
    }

    function startCanvasHeartbeatFallback() {
      if (keepAwakeInterval) return;
      const canvas = document.getElementById('keep-awake-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let toggle = false;
      keepAwakeInterval = setInterval(() => {
        if (ctx) {
          toggle = !toggle;
          ctx.fillStyle = toggle ? '#000000' : '#010101';
          ctx.fillRect(0, 0, 1, 1);
        }
      }, 10000);
    }

    // 화면 복귀 시 Wake Lock 자동 재요청
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        if (!wakeLock) {
          await requestWakeLock();
        }
      }
    });

    function showCustomConfirm(message, onConfirm) {
      const confirmModal = document.getElementById('custom-confirm-modal');
      const confirmMsg = document.getElementById('confirm-message');
      const btnYes = document.getElementById('btn-confirm-yes');
      const btnNo = document.getElementById('btn-confirm-no');

      confirmMsg.innerText = message;
      confirmModal.style.display = 'flex';

      const handleYes = () => { cleanup(); confirmModal.style.display = 'none'; onConfirm(); };
      const handleNo = () => { cleanup(); confirmModal.style.display = 'none'; };
      const cleanup = () => { btnYes.removeEventListener('click', handleYes); btnNo.removeEventListener('click', handleNo); };

      btnYes.addEventListener('click', handleYes);
      btnNo.addEventListener('click', handleNo);
    }

    function loadStorage() {
      const savedConfig = localStorage.getItem('tennis_config');
      if (savedConfig) { 
        try { 
          config = { ...config, ...JSON.parse(savedConfig) }; 
        } catch(e) {} 
      }
      const savedState = localStorage.getItem('tennis_state');
      if (savedState) { 
        try { 
          state = JSON.parse(savedState); 
        } catch(e) {} 
      }
    }

    function saveConfigToStorage() { localStorage.setItem('tennis_config', JSON.stringify(config)); }
    function saveStateToStorage() { localStorage.setItem('tennis_state', JSON.stringify(state)); }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => {});
      else document.exitFullscreen().catch(e => {});
    }

    async function startFullscreenApp() {
      toggleFullscreen();
      await requestWakeLock();
      document.getElementById('fs-overlay').style.display = 'none';
      render();
    }

    window.onload = async () => {
      if (!checkDomainAuth()) return;
      loadStorage();
      setupEvents();
      setupSwipeEvents();
      populateSettingsModal();
      await requestWakeLock();
      render();
    };

    function setupEvents() {
      const modal = document.getElementById('settings-modal');
      const openModal = () => { populateSettingsModal(); modal.style.display = 'block'; };

      document.getElementById('btn-settings-sidebar').onclick = openModal;
      document.getElementById('btn-close-settings').onclick = () => { modal.style.display = 'none'; };

      window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

      document.getElementById('btn-save-settings').onclick = () => {
        saveSettings();
        modal.style.display = 'none';
      };
    }

    function setupSwipeEvents() {
      window.addEventListener('touchstart', (e) => {
        if (e.target.closest('.modal') || e.target.closest('.confirm-modal')) return;
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        if (e.target.closest('.modal') || e.target.closest('.confirm-modal')) return;
        touchEndX = e.changedTouches[0].screenX;
        touchEndY = e.changedTouches[0].screenY;
        handleSwipeGesture();
      }, { passive: true });
    }

    function handleSwipeGesture() {
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      if (Math.abs(deltaX) < 40 && Math.abs(deltaY) < 40) return;

      let action = 'none';
      if (Math.abs(deltaX) > Math.abs(deltaY)) {
        action = deltaX < 0 ? config.swipes.left : config.swipes.right;
      } else {
        action = deltaY < 0 ? config.swipes.up : config.swipes.down;
      }
      executeControlAction(action);
    }

    function executeControlAction(action) {
      const leftTeam = state.courtLeftTeam;
      const rightTeam = (leftTeam === 'A') ? 'B' : 'A';

      switch (action) {
        case 'left_score': addPoint(leftTeam); break;
        case 'right_score': addPoint(rightTeam); break;
        case 'court_change': manualCourtChange(); break;
        case 'undo': undo(); break;
      }
    }

    function populateSettingsModal() {
      document.getElementById('set-camera-res').value = config.cameraRes || 'max';
      document.getElementById('set-gesture-hold').value = (config.gestureHoldDuration || 1.0).toString();
      document.getElementById('set-type').value = config.type;
      document.getElementById('set-voice-lang').value = config.voiceLang || 'en-GB';
      document.getElementById('set-first-serve').value = config.firstServeTeam;
      document.getElementById('set-sets').value = config.setsToWin;
      document.getElementById('set-games').value = config.gamesPerSet;
      document.getElementById('set-deuce').value = config.deuceRule;
      document.getElementById('set-court').value = config.courtChange;
      document.getElementById('set-announce-server').value = config.announceServer || '3000';
      document.getElementById('p-a1').value = config.playersA[0] || '';
      document.getElementById('p-a2').value = config.playersA[1] || '';
      document.getElementById('p-b1').value = config.playersB[0] || '';
      document.getElementById('p-b2').value = config.playersB[1] || '';

      document.getElementById('swipe-up').value = config.swipes.up || 'right_score';
      document.getElementById('swipe-down').value = config.swipes.down || 'left_score';
      document.getElementById('swipe-left').value = config.swipes.left || 'court_change';
      document.getElementById('swipe-right').value = config.swipes.right || 'undo';

      togglePlayerInputs();
    }

    function togglePlayerInputs() {
      const isSingles = document.getElementById('set-type').value === 'singles';
      document.getElementById('p-a2').style.display = isSingles ? 'none' : 'block';
      document.getElementById('p-b2').style.display = isSingles ? 'none' : 'block';
    }

    function saveSettings() {
      cancelServerAnnouncement();

      const prevCameraRes = config.cameraRes;
      config.cameraRes = document.getElementById('set-camera-res').value;
      config.gestureHoldDuration = parseFloat(document.getElementById('set-gesture-hold').value) || 1.0;
      config.type = document.getElementById('set-type').value;
      config.voiceLang = document.getElementById('set-voice-lang').value;
      config.firstServeTeam = document.getElementById('set-first-serve').value;
      config.setsToWin = parseInt(document.getElementById('set-sets').value, 10);
      config.gamesPerSet = parseInt(document.getElementById('set-games').value, 10);
      config.deuceRule = document.getElementById('set-deuce').value;
      config.courtChange = document.getElementById('set-court').value;
      config.announceServer = document.getElementById('set-announce-server').value;
      
      config.playersA = [document.getElementById('p-a1').value || 'A. P1', document.getElementById('p-a2').value || 'A. P2'];
      config.playersB = [document.getElementById('p-b1').value || 'B. P1', document.getElementById('p-b2').value || 'B. P2'];

      config.swipes = {
        up: document.getElementById('swipe-up').value,
        down: document.getElementById('swipe-down').value,
        left: document.getElementById('swipe-left').value,
        right: document.getElementById('swipe-right').value
      };

      saveConfigToStorage();

      if (isCameraActive && prevCameraRes !== config.cameraRes) {
        stopCameraRecognition();
        startCameraRecognition();
      }

      render();
    }

    function getCameraResolution(resKey) {
      switch (resKey) {
        case '1080': return { width: 1920, height: 1080 };
        case '720': return { width: 1280, height: 720 };
        case '480': return { width: 640, height: 480 };
        case 'max':
        default: return { width: 3840, height: 2160 };
      }
    }

    function toggleCameraRecognition() {
      if (isCameraActive) {
        stopCameraRecognition();
        speak("Camera disabled.");
      } else {
        startCameraRecognition();
        speak("Camera enabled.");
      }
    }

    async function startCameraRecognition() {
      const videoElement = document.getElementById('hidden-video');
      const cameraBtn = document.getElementById('btn-camera-toggle');

      try {
        if (!poseInstance) {
          poseInstance = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
          });
          poseInstance.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
          });
          poseInstance.onResults(onPoseResults);
        }

        const res = getCameraResolution(config.cameraRes);

        cameraInstance = new Camera(videoElement, {
          onFrame: async () => {
            if (isCameraActive && videoElement) {
              await poseInstance.send({ image: videoElement });
            }
          },
          width: res.width,
          height: res.height
        });

        await cameraInstance.start();
        isCameraActive = true;
        cameraBtn.classList.add('active-camera');
      } catch (err) {
        console.error("Camera activation error:", err);
        isCameraActive = false;
        cameraBtn.classList.remove('active-camera');
        speak("Failed to access camera.");
      }
    }

    function stopCameraRecognition() {
      if (cameraInstance) {
        cameraInstance.stop();
        cameraInstance = null;
      }
      isCameraActive = false;
      document.getElementById('btn-camera-toggle').classList.remove('active-camera');
      resetGestureGauge();
    }

    /* =========================================================================
       제스쳐 인식 및 조건 처리 로직
       - 좌측 스코어: 왼손만 머리(코) 위로 완전히 올라갔을 때
       - 우측 스코어: 양손(왼손, 오른손)이 모두 머리(코) 위로 완전히 올라갔을 때
       ========================================================================= */
    function onPoseResults(results) {
      if (!isCameraActive || !results.poseLandmarks) {
        resetGestureGauge();
        return;
      }

      const now = Date.now();

      // 3초간 인식 차단 (Cool-down)
      if (now < cooldownUntilTime) {
        const remainingCd = ((cooldownUntilTime - now) / 1000).toFixed(1);
        updateCooldownGaugeDisplay(remainingCd);
        return;
      }

      const landmarks = results.poseLandmarks;

      // MediaPipe Pose 주요 랜드마크 (0: nose, 15: left_wrist, 16: right_wrist)
      const nose = landmarks[0];
      const leftWrist = landmarks[15];
      const rightWrist = landmarks[16];

      if (!nose || !leftWrist || !rightWrist) {
        resetGestureGauge();
        return;
      }

      const headThresholdY = nose.y;

      // Y 좌표는 위쪽이 0에 가깝고 아래쪽이 1에 가까움 (wrist.y < nose.y 인 경우 머리 위로 올라감)
      const isLeftUp = (leftWrist.y < headThresholdY) && (leftWrist.visibility > 0.4);
      const isRightUp = (rightWrist.y < headThresholdY) && (rightWrist.visibility > 0.4);

      let currentTarget = null; // 'left' (좌측 점수 추가), 'right' (우측 점수 추가)

      if (isLeftUp && isRightUp) {
        // 양손이 모두 머리 위로 완전히 올라간 경우 -> 우측 스코어 추가
        currentTarget = 'right';
      } else if (isLeftUp && !isRightUp) {
        // 왼손만 머리 위로 완전히 올라간 경우 -> 좌측 스코어 추가
        currentTarget = 'left';
      }

      if (currentTarget) {
        if (detectedTargetSide !== currentTarget) {
          detectedTargetSide = currentTarget;
          gestureStartTime = now;
        }

        const requiredDurationMs = (config.gestureHoldDuration || 1.0) * 1000;
        const elapsed = now - gestureStartTime;
        const progressRatio = Math.min(elapsed / requiredDurationMs, 1.0);

        updateGestureGaugeDisplay(currentTarget, progressRatio);

        if (elapsed >= requiredDurationMs) { // 설정된 유지 시간 달성 시 스코어 추가
          const targetTeam = (currentTarget === 'left') ? state.courtLeftTeam : (state.courtLeftTeam === 'A' ? 'B' : 'A');
          addPoint(targetTeam);

          // 득점 처리 후 3초간 쿨다운 적용
          cooldownUntilTime = Date.now() + 3000;
          gestureStartTime = null;
          detectedTargetSide = null;
        }
      } else {
        resetGestureGauge();
      }
    }

    function updateGestureGaugeDisplay(side, ratio) {
      const leftGauge = document.getElementById('gauge-left');
      const rightGauge = document.getElementById('gauge-right');
      const fillLeft = document.getElementById('gauge-fill-left');
      const fillRight = document.getElementById('gauge-fill-right');
      const holdText = `${(config.gestureHoldDuration || 1.0).toFixed(1)}s HOLD`;

      leftGauge.classList.remove('cooldown');
      rightGauge.classList.remove('cooldown');

      if (side === 'left') {
        leftGauge.classList.add('active');
        rightGauge.classList.remove('active');
        fillLeft.style.height = `${ratio * 100}%`;
        fillRight.style.height = `0%`;
        document.getElementById('gauge-text-left').innerText = holdText;
      } else if (side === 'right') {
        rightGauge.classList.add('active');
        leftGauge.classList.remove('active');
        fillRight.style.height = `${ratio * 100}%`;
        fillLeft.style.height = `0%`;
        document.getElementById('gauge-text-right').innerText = holdText;
      }
    }

    function updateCooldownGaugeDisplay(remainingSec) {
      const leftGauge = document.getElementById('gauge-left');
      const rightGauge = document.getElementById('gauge-right');

      leftGauge.classList.add('active', 'cooldown');
      rightGauge.classList.add('active', 'cooldown');

      document.getElementById('gauge-fill-left').style.height = '100%';
      document.getElementById('gauge-fill-right').style.height = '100%';

      document.getElementById('gauge-text-left').innerText = `COOL ${remainingSec}s`;
      document.getElementById('gauge-text-right').innerText = `COOL ${remainingSec}s`;
    }

    function resetGestureGauge() {
      gestureStartTime = null;
      detectedTargetSide = null;

      const leftGauge = document.getElementById('gauge-left');
      const rightGauge = document.getElementById('gauge-right');

      leftGauge.classList.remove('active', 'cooldown');
      rightGauge.classList.remove('active', 'cooldown');

      document.getElementById('gauge-fill-left').style.height = '0%';
      document.getElementById('gauge-fill-right').style.height = '0%';
    }

    function saveState() {
      historyStack.push(JSON.parse(JSON.stringify(state)));
      if (historyStack.length > MAX_HISTORY) historyStack.shift();
    }

    function undo() {
      cancelServerAnnouncement();
      if (historyStack.length === 0) return;
      state = historyStack.pop();
      saveStateToStorage();
      render();
      speakCall("Correction, ");
    }

    function confirmResetMatch() {
      showCustomConfirm("정말로 경기를 초기화하시겠습니까?", () => { resetMatch(); });
    }

    function resetMatch() {
      cancelServerAnnouncement();
      state = {
        ptsA: 0, ptsB: 0, gamesA: 0, gamesB: 0, setsA: 0, setsB: 0,
        isTiebreak: false, tiebreakFirstServer: null,
        currentServerTeam: config.firstServeTeam,
        courtLeftTeam: 'A'
      };
      historyStack = [];
      saveStateToStorage();
      render();
      speak("Reset.");
    }

    function toggleServeTeam() {
      cancelServerAnnouncement();
      saveState();
      state.currentServerTeam = state.currentServerTeam === 'A' ? 'B' : 'A';
      saveStateToStorage();
      render();
      speak(`Service Team ${state.currentServerTeam}.`);
      scheduleServerAnnouncement();
    }

    function addPoint(team) {
      cancelServerAnnouncement();
      saveState();
      if (state.isTiebreak) handleTiebreakPoint(team);
      else handleStandardPoint(team);
      saveStateToStorage();
      render();
    }

    function handleStandardPoint(team) {
      const isA = (team === 'A');
      let pWin = isA ? state.ptsA : state.ptsB;
      let pLose = isA ? state.ptsB : state.ptsA;

      if (config.deuceRule === 'no-ad' && pWin === 3 && pLose === 3) { winGame(team); return; }

      if (pWin >= 3 && pLose >= 3) {
        if (pWin === pLose) {
          if (isA) state.ptsA++; else state.ptsB++;
          speakCall();
        } else if ((isA && state.ptsA > state.ptsB) || (!isA && state.ptsB > state.ptsA)) {
          winGame(team);
        } else {
          state.ptsA = 3; state.ptsB = 3;
          speakCall();
        }
      } else if (pWin === 3) {
        winGame(team);
      } else {
        if (isA) state.ptsA++; else state.ptsB++;
        speakCall();
      }
    }

    function handleTiebreakPoint(team) {
      if (team === 'A') state.ptsA++; else state.ptsB++;
      const totalPts = state.ptsA + state.ptsB;

      if (totalPts % 2 === 1) switchServer();
      if (config.courtChange === 'auto' && totalPts % 6 === 0) manualCourtChange(true, false);

      if ((state.ptsA >= 7 || state.ptsB >= 7) && Math.abs(state.ptsA - state.ptsB) >= 2) {
        winGame(state.ptsA > state.ptsB ? 'A' : 'B');
      } else {
        speakCall();
      }
    }

    function getLastName(fullName) {
      if (!fullName) return "";
      const parts = fullName.trim().split(' ');
      return parts[parts.length - 1];
    }

    function getTeamDisplayName(team) {
      return config.type === 'singles' ? getLastName(team === 'A' ? config.playersA[0] : config.playersB[0]) : `Team ${team}`;
    }

    function winGame(team) {
      cancelServerAnnouncement();
      const winnerCall = getTeamDisplayName(team);
      if (team === 'A') state.gamesA++; else state.gamesB++;
      state.ptsA = 0; state.ptsB = 0;

      const gWin = team === 'A' ? state.gamesA : state.gamesB;
      const gLose = team === 'A' ? state.gamesB : state.gamesA;
      let gameAnnouncement = `Game ${winnerCall}. ${state.gamesA} games to ${state.gamesB}.`;

      const totalGames = state.gamesA + state.gamesB;
      const isAutoCourtChange = (config.courtChange === 'auto' && totalGames % 2 === 1 && !state.isTiebreak);

      if (isAutoCourtChange) manualCourtChange(true, false);

      if (state.isTiebreak) {
        winSet(team, true);
      } else if (gWin >= config.gamesPerSet && (gWin - gLose) >= 2) {
        winSet(team, false);
      } else if (gWin === config.gamesPerSet && gLose === config.gamesPerSet) {
        state.isTiebreak = true;
        if (!isAutoCourtChange) speak(`${gameAnnouncement} Tiebreak.`);
        switchServer();
        scheduleServerAnnouncement();
      } else {
        if (!isAutoCourtChange) speak(gameAnnouncement);
        switchServer();
        scheduleServerAnnouncement();
      }
    }

    function winSet(team, viaTiebreak = false) {
      cancelServerAnnouncement();
      const winnerCall = getTeamDisplayName(team);
      if (team === 'A') state.setsA++; else state.setsB++;

      const tiebreakFirstServer = state.tiebreakFirstServer;
      state.gamesA = 0; state.gamesB = 0;
      state.isTiebreak = false;
      state.tiebreakFirstServer = null;

      const sWin = team === 'A' ? state.setsA : state.setsB;
      if (sWin >= config.setsToWin) {
        speak(`Game, set and match, ${winnerCall}. ${state.setsA} sets to ${state.setsB}.`);
      } else {
        speak(`Set, ${winnerCall}. ${state.setsA} sets to ${state.setsB}.`);
        if (viaTiebreak && tiebreakFirstServer) {
          state.currentServerTeam = (tiebreakFirstServer === 'A') ? 'B' : 'A';
          if (config.courtChange === 'auto') manualCourtChange(true, false);
        } else {
          switchServer();
        }
        scheduleServerAnnouncement();
      }
    }

    function switchServer() {
      state.currentServerTeam = state.currentServerTeam === 'A' ? 'B' : 'A';
    }

    function manualCourtChange(announce = true, recordHistory = true) {
      cancelServerAnnouncement();
      if (recordHistory) saveState();
      state.courtLeftTeam = (state.courtLeftTeam === 'A') ? 'B' : 'A';
      saveStateToStorage();
      render();
      if (announce) {
        speak("Change ends.");
        scheduleServerAnnouncement(2500);
      }
    }

    function getSpokenText(text) {
      return text
        .replace(/ 15 /g, "Fifteen")
        .replace(/ 30 /g, "Thirty")
        .replace(/ 40 /g, "Forty")
        .replace(/ 0 /g, "Love")
        .replace(/,\s*,+/g, ".")
        .replace(/\s+/g, " ")
        .trim();
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const spokenText = getSpokenText(text);
          const utterance = new SpeechSynthesisUtterance(spokenText);
          const selectedLang = config.voiceLang || 'en-GB';
          utterance.lang = selectedLang;
          utterance.rate = 0.92;
          utterance.pitch = 1.0;

          const voices = window.speechSynthesis.getVoices();
          if (voices && voices.length > 0) {
            const matchedVoice = voices.find(v => v.lang.replace('_', '-').toLowerCase() === selectedLang.toLowerCase()) ||
                                 voices.find(v => v.lang.toLowerCase().startsWith(selectedLang.substring(0, 2).toLowerCase()));
            if (matchedVoice) {
              utterance.voice = matchedVoice;
            }
          }

          window.speechSynthesis.speak(utterance);
        } catch (e) {}
      }
    }

    function speakCall(prefix = "") {
      let callText = "";
      if (state.isTiebreak) {
        if (state.ptsA === state.ptsB) {
          callText = `${state.ptsA} all.`;
        } else {
          callText = `${state.ptsA}, ${state.ptsB}.`;
        }
      } else {
        const pA = state.ptsA;
        const pB = state.ptsB;

        if (pA >= 3 && pB >= 3) {
          if (pA === pB) callText = "Deuce.";
          else if (pA > pB) callText = `Advantage, ${getTeamDisplayName('A')}.`;
          else callText = `Advantage, ${getTeamDisplayName('B')}.`;
        } else {
          if (pA === pB) callText = pointTerms[pA] === "Love" ? "Love all." : `${pointTerms[pA]} all.`;
          else {
            const sPts = state.currentServerTeam === 'A' ? pA : pB;
            const rPts = state.currentServerTeam === 'A' ? pB : pA;
            callText = `${pointTerms[sPts]} ${pointTerms[rPts]}.`;
          }
        }
      }
      speak(prefix + callText);
    }

    function formatScore(pts, oppPts) {
      if (state.isTiebreak) return pts.toString();
      if (pts >= 3 && oppPts >= 3) {
        if (pts === oppPts) return "40";
        return pts > oppPts ? "AD" : "40";
      }
      return pointTerms[pts] ? (pointTerms[pts] === "Love" ? "0" : (pts === 1 ? "15" : pts === 2 ? "30" : "40")) : "0";
    }

    function render() {
      document.getElementById('disp-players-a').innerText = config.type === 'doubles' 
        ? `${config.playersA[0]} / ${config.playersA[1]}` : config.playersA[0];
      document.getElementById('disp-players-b').innerText = config.type === 'doubles' 
        ? `${config.playersB[0]} / ${config.playersB[1]}` : config.playersB[0];

      document.getElementById('sets-a').innerText = `Set: ${state.setsA}`;
      document.getElementById('sets-b').innerText = `Set: ${state.setsB}`;
      document.getElementById('games-a').innerText = `Game: ${state.gamesA}`;
      document.getElementById('games-b').innerText = `Game: ${state.gamesB}`;

      document.getElementById('points-a').innerText = formatScore(state.ptsA, state.ptsB);
      document.getElementById('points-b').innerText = formatScore(state.ptsB, state.ptsA);

      document.getElementById('serve-a').classList.toggle('active', state.currentServerTeam === 'A');
      document.getElementById('serve-b').classList.toggle('active', state.currentServerTeam === 'B');

      const leftTeam = state.courtLeftTeam;
      const rightTeam = (leftTeam === 'A') ? 'B' : 'A';

      const cardA = document.getElementById('card-team-a');
      cardA.style.order = (leftTeam === 'A') ? 1 : 2;
      const cardB = document.getElementById('card-team-b');
      cardB.style.order = (leftTeam === 'B') ? 1 : 2;

      document.getElementById('arrow-a').innerText = (leftTeam === 'A') ? '◀' : '▶';
      document.getElementById('arrow-b').innerText = (leftTeam === 'A') ? '◀' : '▶';

      document.getElementById('side-left-bg').className = `court-side left ${leftTeam === 'A' ? 'bg-team-a' : 'bg-team-b'}`;
      document.getElementById('side-right-bg').className = `court-side right ${rightTeam === 'A' ? 'bg-team-a' : 'bg-team-b'}`;

      document.getElementById('label-left').innerText = `TEAM ${leftTeam}`;
      document.getElementById('label-right').innerText = `TEAM ${rightTeam}`;

      const totalPts = state.ptsA + state.ptsB;
      const isDeuceServe = (totalPts % 2 === 0);
      const isDoubles = (config.type === 'doubles');

      const serverTeam = state.currentServerTeam;
      const indices = getActiveServerIndices();
      const activeServerIdx = isDoubles ? (serverTeam === 'A' ? indices.serverIdxA : indices.serverIdxB) : 0;

      const pmA1 = document.getElementById('pm-a1');
      const pmA2 = document.getElementById('pm-a2');
      const pmB1 = document.getElementById('pm-b1');
      const pmB2 = document.getElementById('pm-b2');

      const updateMarkerContent = (el, name, role) => {
        let badgeHtml = role ? `<span class="role-badge visible">${role}</span>` : `<span class="role-badge"></span>`;
        el.innerHTML = `<span class="player-name-text">${name}</span>${badgeHtml}`;
      };

      const isA1_Server = (serverTeam === 'A' && activeServerIdx === 0);
      const isA2_Server = (serverTeam === 'A' && activeServerIdx === 1);
      const isB1_Server = (serverTeam === 'B' && activeServerIdx === 0);
      const isB2_Server = (serverTeam === 'B' && activeServerIdx === 1);

      const isA1_Receiver = (serverTeam === 'B' && isDeuceServe);
      const isA2_Receiver = (serverTeam === 'B' && !isDeuceServe);
      const isB1_Receiver = (serverTeam === 'A' && isDeuceServe);
      const isB2_Receiver = (serverTeam === 'A' && !isDeuceServe);

      updateMarkerContent(pmA1, config.playersA[0], isA1_Server ? 'SERVE' : (isA1_Receiver ? 'RECEIVER' : ''));
      updateMarkerContent(pmA2, config.playersA[1], isA2_Server ? 'SERVE' : (isA2_Receiver ? 'RECEIVER' : ''));
      updateMarkerContent(pmB1, config.playersB[0], isB1_Server ? 'SERVE' : (isB1_Receiver ? 'RECEIVER' : ''));
      updateMarkerContent(pmB2, config.playersB[1], isB2_Server ? 'SERVE' : (isB2_Receiver ? 'RECEIVER' : ''));

      pmA1.style.background = 'var(--team-a-color)';
      pmA2.style.background = 'var(--team-a-color)';
      pmB1.style.background = 'var(--team-b-color)';
      pmB2.style.background = 'var(--team-b-color)';

      pmA2.style.display = isDoubles ? 'flex' : 'none';
      pmB2.style.display = isDoubles ? 'flex' : 'none';

      document.querySelectorAll('.player-marker').forEach(m => m.classList.remove('server', 'receiver'));

      if (serverTeam === 'A') {
        if (activeServerIdx === 0) pmA1.classList.add('server'); else pmA2.classList.add('server');
        if (isDeuceServe) pmB1.classList.add('receiver'); else pmB2.classList.add('receiver');
      } else {
        if (activeServerIdx === 0) pmB1.classList.add('server'); else pmB2.classList.add('server');
        if (isDeuceServe) pmA1.classList.add('receiver'); else pmA2.classList.add('receiver');
      }

      const setPos = (el, x, y) => { el.style.left = `${x}%`; el.style.top = `${y}%`; };
      const targetBox = document.getElementById('target-box');

      const placeTeamPlayers = (team, isLeft) => {
        const p1 = (team === 'A') ? pmA1 : pmB1;
        const p2 = (team === 'A') ? pmA2 : pmB2;
        const isServerTeam = (serverTeam === team);

        if (isLeft) {
          if (isServerTeam) {
            if (isDeuceServe) {
              setPos(activeServerIdx === 0 ? p1 : p2, 3, 70);
              if (isDoubles) setPos(activeServerIdx === 0 ? p2 : p1, 38, 25);
            } else {
              setPos(activeServerIdx === 0 ? p1 : p2, 3, 30);
              if (isDoubles) setPos(activeServerIdx === 0 ? p2 : p1, 38, 75);
            }
          } else {
            setPos(p1, 14, 68);
            if (isDoubles) setPos(p2, 14, 32);
          }
        } else {
          if (isServerTeam) {
            if (isDeuceServe) {
              setPos(activeServerIdx === 0 ? p1 : p2, 97, 30);
              if (isDoubles) setPos(activeServerIdx === 0 ? p2 : p1, 62, 75);
            } else {
              setPos(activeServerIdx === 0 ? p1 : p2, 97, 70);
              if (isDoubles) setPos(activeServerIdx === 0 ? p2 : p1, 62, 25);
            }
          } else {
            setPos(p1, 86, 32);
            if (isDoubles) setPos(p2, 86, 68);
          }
        }
      };

      placeTeamPlayers(leftTeam, true);
      placeTeamPlayers(rightTeam, false);

      const serverOnLeft = (serverTeam === leftTeam);
      targetBox.style.transform = 'none';

      if (serverOnLeft) {
        targetBox.style.left = '50%';
        targetBox.style.width = '25%';
        targetBox.style.height = '35%';
        targetBox.style.top = isDeuceServe ? '15%' : '50%';
      } else {
        targetBox.style.left = '25%';
        targetBox.style.width = '25%';
        targetBox.style.height = '35%';
        targetBox.style.top = isDeuceServe ? '50%' : '15%';
      }
    }
  </script>
</body>
</html>
