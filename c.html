<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 손 모양 인식 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- MediaPipe Hands CDN scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        /* Custom pulse animation for active gesture indicators */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .gesture-active {
            animation: pulse-ring 0.6s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col overflow-hidden">

    <!-- Header Navigation -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></div>
            <h1 class="text-base font-bold tracking-tight text-white">AI 핸드 제스처 디텍터</h1>
        </div>
        <div id="status-badge" class="px-2.5 py-1 text-xs font-medium rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
            카메라 준비중...
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 relative flex flex-col overflow-hidden bg-slate-900">
        <!-- Video Feed & Canvas Wrapper -->
        <div class="relative w-full flex-1 overflow-hidden bg-black flex items-center justify-center">
            <!-- Hidden Video element fed to MediaPipe -->
            <video id="webcam" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100" playsinline></video>
            <!-- Canvas for drawing landmarks and skeleton -->
            <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100 pointer-events-none"></canvas>

            <!-- Floating Detected Gesture Badge overlay -->
            <div class="absolute top-4 left-4 right-4 flex justify-between items-start pointer-events-none z-10">
                <div id="gesture-banner" class="bg-slate-900/80 backdrop-blur-md border border-slate-700/50 px-4 py-2.5 rounded-2xl shadow-2xl flex items-center space-x-3 transition-all duration-300">
                    <span id="gesture-emoji" class="text-3xl">🤖</span>
                    <div>
                        <div class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">감지된 제스처</div>
                        <div id="gesture-name" class="text-sm font-bold text-white">손을 카메라에 비춰주세요</div>
                    </div>
                </div>

                <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700/50 px-3 py-2 rounded-xl text-right">
                    <div class="text-[10px] text-slate-400 font-medium">FPS</div>
                    <div id="fps-counter" class="text-xs font-mono font-bold text-emerald-400">0</div>
                </div>
            </div>

            <!-- Interaction guide hint -->
            <div id="permission-hint" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 text-center z-30 transition-opacity duration-500">
                <div class="w-16 h-16 bg-indigo-600/20 border border-indigo-500/30 rounded-2xl flex items-center justify-center text-indigo-400 mb-4 text-3xl">
                    👋
                </div>
                <h2 class="text-lg font-bold text-white mb-2">손 모양 인식 시작하기</h2>
                <p class="text-xs text-slate-400 max-w-xs mb-6 leading-relaxed">
                    스마트폰 전/후면 카메라를 활용해 주먹, 보자기, V사인, 엄지척 등의 제스처를 실시간으로 인식합니다.
                </p>
                <button id="start-btn" class="w-full max-w-xs bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-semibold py-3 px-6 rounded-xl shadow-lg shadow-indigo-600/30 transition-all text-sm">
                    카메라 권한 허용 및 시작
                </button>
            </div>
        </div>

        <!-- Bottom Panel: Recognized Cards & Logs -->
        <div class="bg-slate-900 border-t border-slate-800 p-4 shrink-0 flex flex-col space-y-3 z-20 max-h-[35%] overflow-hidden">
            <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center space-x-1.5">
                    <span>⚡ 지원 제스처 목록 & 상태</span>
                </span>
                <button id="clear-log" class="text-[11px] text-slate-400 hover:text-white underline">로그 초기화</button>
            </div>

            <!-- Gesture Quick Cards Row -->
            <div class="grid grid-cols-4 gap-2 shrink-0">
                <div id="card-fist" class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-2 text-center transition-all duration-200">
                    <div class="text-xl">✊</div>
                    <div class="text-[10px] text-slate-300 font-medium mt-1">주먹 (Fist)</div>
                </div>
                <div id="card-palm" class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-2 text-center transition-all duration-200">
                    <div class="text-xl">🖐️</div>
                    <div class="text-[10px] text-slate-300 font-medium mt-1">보자기 (Open)</div>
                </div>
                <div id="card-victory" class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-2 text-center transition-all duration-200">
                    <div class="text-xl">✌️</div>
                    <div class="text-[10px] text-slate-300 font-medium mt-1">V사인 (Victory)</div>
                </div>
                <div id="card-thumbsup" class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-2 text-center transition-all duration-200">
                    <div class="text-xl">👍</div>
                    <div class="text-[10px] text-slate-300 font-medium mt-1">엄지척 (Thumb)</div>
                </div>
            </div>

            <!-- Live Event Log Scroll Container -->
            <div id="log-container" class="bg-slate-950/70 border border-slate-800 rounded-xl p-2.5 h-20 overflow-y-auto font-mono text-[11px] text-slate-400 space-y-1">
                <div class="text-slate-500">[시스템] 카메라 활성화를 대기 중입니다...</div>
            </div>
        </div>
    </main>

    <script>
        // DOM Elements
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const permissionHint = document.getElementById('permission-hint');
        const statusBadge = document.getElementById('status-badge');
        const gestureEmoji = document.getElementById('gesture-emoji');
        const gestureName = document.getElementById('gesture-name');
        const gestureBanner = document.getElementById('gesture-banner');
        const fpsCounter = document.getElementById('fps-counter');
        const logContainer = document.getElementById('log-container');
        const clearLogBtn = document.getElementById('clear-log');

        // Cards mapping
        const gestureCards = {
            '주먹 (Fist)': document.getElementById('card-fist'),
            '보자기 (Open Palm)': document.getElementById('card-palm'),
            'V사인 (Victory)': document.getElementById('card-victory'),
            '엄지척 (Thumbs Up)': document.getElementById('card-thumbsup')
        };

        let lastGesture = '';
        let lastLogTime = 0;
        let frameCount = 0;
        let lastFpsUpdate = Date.now();
        let camera = null;

        // Add log entry function
        function addLog(message, type = 'info') {
            const timeStr = new Date().toLocaleTimeString();
            const logDiv = document.createElement('div');
            let colorClass = 'text-slate-400';
            if (type === 'success') colorClass = 'text-emerald-400 font-semibold';
            if (type === 'warn') colorClass = 'text-amber-400';
            
            logDiv.className = `${colorClass} truncate`;
            logDiv.textContent = `[${timeStr}] ${message}`;
            logContainer.prepend(logDiv);

            // Limit log items
            if (logContainer.children.length > 30) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        clearLogBtn.addEventListener('click', () => {
            logContainer.innerHTML = '';
            addLog('로그가 초기화되었습니다.');
        });

        // Helper: Euclidean distance between two landmarks
        function distance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        // Advanced Gesture Recognition Logic based on 21 MediaPipe Landmarks
        function classifyGesture(landmarks) {
            // Landmark indices reference:
            // Wrist: 0
            // Thumb: 1, 2, 3, 4 (Tip: 4)
            // Index: 5, 6, 7, 8 (Tip: 8)
            // Middle: 9, 10, 11, 12 (Tip: 12)
            // Ring: 13, 14, 15, 16 (Tip: 16)
            // Pinky: 17, 18, 19, 20 (Tip: 20)

            const wrist = landmarks[0];

            // Check if fingers are extended by comparing distance from wrist to tip vs wrist to MCP joint
            const fingers = [
                { tip: 8, mcp: 5, name: 'index' },
                { tip: 12, mcp: 9, name: 'middle' },
                { tip: 16, mcp: 13, name: 'ring' },
                { tip: 20, mcp: 17, name: 'pinky' }
            ];

            let extendedCount = 0;
            const fingerStates = {};

            fingers.forEach(f => {
                const tipDist = distance(landmarks[f.tip], wrist);
                const mcpDist = distance(landmarks[f.mcp], wrist);
                // If tip is noticeably further from wrist than MCP joint, finger is extended
                const isExtended = tipDist > mcpDist * 1.15;
                fingerStates[f.name] = isExtended;
                if (isExtended) extendedCount++;
            });

            // Thumb extension check (compare thumb tip distance to pinky MCP or wrist)
            const thumbTip = landmarks[4];
            const thumbIp = landmarks[3];
            const indexMcp = landmarks[5];
            const thumbOpenDist = distance(thumbTip, indexMcp);
            const isThumbExtended = thumbOpenDist > 0.15; // Normalized coordinate threshold

            // 1. Fist (주먹): All fingers folded
            if (extendedCount === 0 && !isThumbExtended) {
                return { name: '주먹 (Fist)', emoji: '✊' };
            }

            // 2. Open Palm (보자기): All fingers extended
            if (extendedCount >= 4 && isThumbExtended) {
                return { name: '보자기 (Open Palm)', emoji: '🖐️' };
            }

            // 3. Victory Sign (V사인): Index & Middle extended, Ring & Pinky folded
            if (fingerStates.index && fingerStates.middle && !fingerStates.ring && !fingerStates.pinky) {
                return { name: 'V사인 (Victory)', emoji: '✌️' };
            }

            // 4. Thumbs Up (엄지척): Thumb extended upward, other fingers folded
            if (isThumbExtended && extendedCount === 0 && thumbTip.y < landmarks[2].y) {
                return { name: '엄지척 (Thumbs Up)', emoji: '👍' };
            }

            // Default / Other
            if (extendedCount === 1 && fingerStates.index) {
                return { name: '가리키기 (Pointing)', emoji: '👉' };
            }

            return { name: '감지 중 (Detecting...)', emoji: '✋' };
        }

        function onResults(results) {
            // Resize canvas to match video stream dimensions
            if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
                canvasElement.width = videoElement.videoWidth || 640;
                canvasElement.height = videoElement.videoHeight || 480;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // Calculate FPS
            frameCount++;
            const now = Date.now();
            if (now - lastFpsUpdate >= 1000) {
                fpsCounter.textContent = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
                frameCount = 0;
                lastFpsUpdate = now;
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // Draw skeleton landmarks on canvas with customized nice styling
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#6366f1', lineWidth: 4 });
                drawLandmarks(canvasCtx, landmarks, { color: '#ec4899', lineWidth: 2, radius: 5 });

                // Classify gesture
                const detected = classifyGesture(landmarks);
                
                // Update UI Banner
                gestureEmoji.textContent = detected.emoji;
                gestureName.textContent = detected.name;

                // Highlight active card
                Object.keys(gestureCards).forEach(key => {
                    if (key === detected.name) {
                        gestureCards[key].classList.add('bg-indigo-600/30', 'border-indigo-500', 'gesture-active');
                    } else {
                        gestureCards[key].classList.remove('bg-indigo-600/30', 'border-indigo-500', 'gesture-active');
                    }
                });

                // Trigger log on gesture change with throttle
                if (detected.name !== '감지 중 (Detecting...)' && (detected.name !== lastGesture || now - lastLogTime > 2500)) {
                    addLog(`이벤트 발생: ${detected.name} 감지됨!`, 'success');
                    lastGesture = detected.name;
                    lastLogTime = now;

                    // Add haptic feedback if supported by mobile browser
                    if (navigator.vibrate) {
                        navigator.vibrate(50);
                    }
                }
            } else {
                gestureEmoji.textContent = '🤖';
                gestureName.textContent = '손을 화면에 보여주세요';
                Object.keys(gestureCards).forEach(key => {
                    gestureCards[key].classList.remove('bg-indigo-600/30', 'border-indigo-500', 'gesture-active');
                });
            }

            canvasCtx.restore();
        }

        // Setup MediaPipe Hands Instance
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.65,
            minTrackingConfidence: 0.65
        });

        hands.onResults(onResults);

        // Start Camera Stream button handler
        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            startBtn.textContent = '카메라 연결 중...';
            addLog('카메라 스트림 요청 중...');

            try {
                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 640,
                    height: 480,
                    facingMode: 'user' // Front camera preferred for smartphones
                });

                await camera.start();
                
                // Fade out permission overlay
                permissionHint.style.opacity = '0';
                setTimeout(() => {
                    permissionHint.style.display = 'none';
                }, 500);

                statusBadge.className = 'px-2.5 py-1 text-xs font-medium rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                statusBadge.textContent = '인식 중 (Live)';
                addLog('카메라가 성공적으로 연결되었습니다.', 'success');
            } catch (err) {
                console.error(err);
                addLog(`카메라 오류: ${err.message || '권한이 거부되었습니다.'}`, 'warn');
                startBtn.disabled = false;
                startBtn.textContent = '다시 시도하기';
                statusBadge.textContent = '연결 실패';
            }
        });
    </script>
</body>
</html>
