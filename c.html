<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>두 손 머리 위 O/X 제스처 인식기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- MediaPipe Hands CDN scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        @keyframes scale-pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 25px rgba(255,255,255,0.8)); }
            100% { transform: scale(1); opacity: 0.9; }
        }
        .animate-ox {
            animation: scale-pulse 0.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col overflow-hidden">

    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0 z-30">
        <div class="flex items-center space-x-2.5">
            <div id="status-dot" class="w-3 h-3 bg-amber-500 rounded-full animate-pulse"></div>
            <h1 class="text-sm md:text-base font-bold tracking-tight text-white">머리 위 O / 만세(X) 제스처 인식</h1>
        </div>
        <div id="status-badge" class="px-2.5 py-1 text-xs font-medium rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
            대기 중
        </div>
    </header>

    <main class="flex-1 relative flex flex-col overflow-hidden bg-slate-900">
        <!-- Video Feed & Canvas Wrapper -->
        <div class="relative w-full flex-1 overflow-hidden bg-black flex items-center justify-center">
            <!-- Hidden Video element fed to MediaPipe -->
            <video id="webcam" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100" playsinline></video>
            <!-- Canvas for drawing landmarks and skeleton -->
            <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100 pointer-events-none"></canvas>

            <!-- Large Center Overlay for O or X -->
            <div id="overlay-display" class="absolute inset-0 flex items-center justify-center pointer-events-none z-20 transition-all duration-300 opacity-0">
                <div id="overlay-box" class="text-[140px] md:text-[200px] font-black tracking-tighter drop-shadow-2xl transition-all duration-300">
                    <!-- Dynamic O or X character -->
                </div>
            </div>

            <!-- Progress Ring / Hold Timer Indicator Overlay -->
            <div id="progress-indicator" class="absolute inset-x-0 bottom-24 flex flex-col items-center justify-center pointer-events-none z-25 opacity-0 transition-opacity duration-200">
                <div class="relative w-20 h-20 flex items-center justify-center bg-slate-900/80 backdrop-blur-md rounded-full border border-slate-700 shadow-2xl">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                        <path class="text-slate-700" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path id="progress-ring-path" class="text-cyan-400 transition-all duration-75" stroke-dasharray="100, 100" stroke-width="3.5" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <div id="progress-text" class="absolute text-xs font-bold font-mono text-white">1.0s</div>
                </div>
                <div id="progress-label" class="mt-2 px-3 py-1 bg-slate-900/90 text-xs font-bold text-cyan-300 rounded-full shadow-lg border border-cyan-500/30">
                    유지 중...
                </div>
            </div>

            <!-- Top Floating Info & FPS -->
            <div class="absolute top-4 left-4 right-4 flex justify-between items-start pointer-events-none z-10">
                <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700/50 px-4 py-2.5 rounded-2xl shadow-xl flex items-center space-x-3">
                    <span id="instruction-emoji" class="text-2xl">💡</span>
                    <div>
                        <div class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">가이드 안내</div>
                        <div id="instruction-text" class="text-xs md:text-sm font-bold text-white">두 손을 머리 위로 올려주세요</div>
                    </div>
                </div>

                <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700/50 px-3 py-2 rounded-xl text-right">
                    <div class="text-[10px] text-slate-400 font-medium">FPS</div>
                    <div id="fps-counter" class="text-xs font-mono font-bold text-emerald-400">0</div>
                </div>
            </div>

            <!-- Permission / Start Overlay Modal -->
            <div id="permission-hint" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-6 text-center z-40 transition-opacity duration-500">
                <div class="w-16 h-16 bg-cyan-600/20 border border-cyan-500/30 rounded-2xl flex items-center justify-center text-cyan-400 mb-4 text-3xl shadow-lg shadow-cyan-500/10">
                    🙌
                </div>
                <h2 class="text-lg md:text-xl font-bold text-white mb-2">머리 위 O / 만세(X) 감지기</h2>
                <p class="text-xs md:text-sm text-slate-400 max-w-sm mb-6 leading-relaxed">
                    카메라 앞에 서서 동작을 <strong>1초 이상</strong> 유지해 보세요!<br>
                    ⭕ <strong>머리 위 O자:</strong> 두 손을 모아 둥글게 원 만들기<br>
                    ❌ <strong>만세 포즈(X):</strong> 두 손을 높이 수직으로 쭉 뻗기
                </p>
                <button id="start-btn" class="w-full max-w-xs bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-cyan-600/30 transition-all text-sm">
                    카메라 켜고 시작하기
                </button>
            </div>
        </div>

        <div class="bg-slate-900 border-t border-slate-800 p-4 shrink-0 flex flex-col space-y-3 z-30 max-h-[32%] overflow-hidden">
            <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center space-x-1.5">
                    <span>📡 실시간 감지 상태 및 이벤트 로그</span>
                </span>
                <button id="clear-log" class="text-[11px] text-slate-400 hover:text-white underline">로그 초기화</button>
            </div>

            <!-- Status Indicator Cards -->
            <div class="grid grid-cols-2 gap-3 shrink-0">
                <div id="card-o" class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-3 text-center transition-all duration-300 flex items-center justify-center space-x-3">
                    <span class="text-2xl">⭕</span>
                    <div class="text-left">
                        <div class="text-xs font-bold text-slate-200">동그라미 (O)</div>
                        <div id="status-o-sub" class="text-[10px] text-slate-400">1초 유지 시 발동</div>
                    </div>
                </div>
                <div id="card-x" class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-3 text-center transition-all duration-300 flex items-center justify-center space-x-3">
                    <span class="text-2xl">❌</span>
                    <div class="text-left">
                        <div class="text-xs font-bold text-slate-200">만세 포즈 (X)</div>
                        <div id="status-x-sub" class="text-[10px] text-slate-400">1초 유지 시 발동</div>
                    </div>
                </div>
            </div>

            <!-- Live Event Log Scroll Container -->
            <div id="log-container" class="bg-slate-950/70 border border-slate-800 rounded-xl p-2.5 h-16 overflow-y-auto font-mono text-[11px] text-slate-400 space-y-1">
                <div class="text-slate-500">[시스템] 카메라 시작 버튼을 눌러주세요.</div>
            </div>
        </div>
    </main>

    <script>
        // DOM Elements
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const permissionHint = document.getElementById('permission-hint');
        const statusBadge = document.getElementById('status-badge');
        const statusDot = document.getElementById('status-dot');
        const instructionEmoji = document.getElementById('instruction-emoji');
        const instructionText = document.getElementById('instruction-text');
        const fpsCounter = document.getElementById('fps-counter');
        const overlayDisplay = document.getElementById('overlay-display');
        const overlayBox = document.getElementById('overlay-box');
        const progressIndicator = document.getElementById('progress-indicator');
        const progressRingPath = document.getElementById('progress-ring-path');
        const progressText = document.getElementById('progress-text');
        const progressLabel = document.getElementById('progress-label');
        const cardO = document.getElementById('card-o');
        const cardX = document.getElementById('card-x');
        const statusOSub = document.getElementById('status-o-sub');
        const statusXSub = document.getElementById('status-x-sub');
        const logContainer = document.getElementById('log-container');
        const clearLogBtn = document.getElementById('clear-log');

        let camera = null;
        let frameCount = 0;
        let lastFpsUpdate = Date.now();
        
        // Timer & Hold state variables (Requirement: 1-second duration)
        let currentDetectedGesture = 'NONE';
        let gestureStartTime = null;
        const HOLD_DURATION_MS = 1000; // 1 second
        let confirmedGesture = 'NONE';

        function addLog(message, type = 'info') {
            const timeStr = new Date().toLocaleTimeString();
            const logDiv = document.createElement('div');
            let colorClass = 'text-slate-400';
            if (type === 'success-o') colorClass = 'text-emerald-400 font-semibold';
            if (type === 'success-x') colorClass = 'text-rose-400 font-semibold';
            if (type === 'warn') colorClass = 'text-amber-400';
            
            logDiv.className = `${colorClass} truncate`;
            logDiv.textContent = `[${timeStr}] ${message}`;
            logContainer.prepend(logDiv);

            if (logContainer.children.length > 30) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        clearLogBtn.addEventListener('click', () => {
            logContainer.innerHTML = '';
            addLog('로그가 초기화되었습니다.');
        });

        // Helper: Euclidean distance
        function distance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        // Gesture analysis for Head O shape and Banzai (hands straight up high) for X
        function analyzeGestures(landmarksList) {
            if (!landmarksList || landmarksList.length < 2) {
                return 'NONE';
            }

            const hand1 = landmarksList[0];
            const hand2 = landmarksList[1];

            const h1Wrist = hand1[0];
            const h2Wrist = hand2[0];
            const h1IndexTip = hand1[8];
            const h2IndexTip = hand2[8];

            // Both hands must be positioned above head level (upper half of screen, y < 0.45)
            const areAboveHead = h1Wrist.y < 0.45 && h2Wrist.y < 0.45;
            if (!areAboveHead) {
                return 'NONE';
            }

            const handsDist = distance(h1Wrist, h2Wrist);
            const yDiff = Math.abs(h1Wrist.y - h2Wrist.y);

            // 1. O Shape Criteria: Two hands are close together near the top center (forming a circular arch)
            // Wrists/hands are moderately close (0.08 to 0.35) and horizontally aligned
            if (handsDist > 0.08 && handsDist < 0.35 && yDiff < 0.15) {
                return 'O_SHAPE';
            }

            // 2. Banzai (Hands raised straight up high) Criteria for X:
            // Both hands are extended high and widely separated or fingertips pointing right up near top edge (y < 0.20)
            const areVeryHigh = h1IndexTip.y < 0.25 && h2IndexTip.y < 0.25;
            const isWideSeparation = handsDist > 0.25;

            if (areVeryHigh || (isWideSeparation && yDiff < 0.15 && h1Wrist.y < 0.35 && h2Wrist.y < 0.35)) {
                return 'BANZAI_X';
            }

            return 'NONE';
        }

        function onResults(results) {
            if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
                canvasElement.width = videoElement.videoWidth || 640;
                canvasElement.height = videoElement.videoHeight || 480;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // FPS Calculation
            frameCount++;
            const now = Date.now();
            if (now - lastFpsUpdate >= 1000) {
                fpsCounter.textContent = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
                frameCount = 0;
                lastFpsUpdate = now;
            }

            let detected = 'NONE';

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#06b6d4', lineWidth: 3 });
                    drawLandmarks(canvasCtx, landmarks, { color: '#f43f5e', lineWidth: 2, radius: 4 });
                }

                detected = analyzeGestures(results.multiHandLandmarks);
            }

            // Handle 1-second hold timer logic
            if (detected !== 'NONE') {
                if (currentDetectedGesture !== detected) {
                    // Gesture changed or started
                    currentDetectedGesture = detected;
                    gestureStartTime = now;
                }

                const elapsed = now - gestureStartTime;
                const progress = Math.min(1, elapsed / HOLD_DURATION_MS);
                const remainingSec = Math.max(0, ((HOLD_DURATION_MS - elapsed) / 1000)).toFixed(1);

                // Update Progress Ring UI
                progressIndicator.style.opacity = '1';
                const dashoffset = 100 - (progress * 100);
                progressRingPath.style.strokeDasharray = `${100 - dashoffset}, 100`;
                progressText.textContent = `${remainingSec}s`;

                if (detected === 'O_SHAPE') {
                    progressRingPath.className = 'text-emerald-400 transition-all duration-75';
                    progressLabel.textContent = '⭕ O형태 유지 중...';
                    progressLabel.className = 'mt-2 px-3 py-1 bg-slate-900/90 text-xs font-bold text-emerald-300 rounded-full shadow-lg border border-emerald-500/30';
                } else {
                    progressRingPath.className = 'text-rose-400 transition-all duration-75';
                    progressLabel.textContent = '❌ 만세(X) 유지 중...';
                    progressLabel.className = 'mt-2 px-3 py-1 bg-slate-900/90 text-xs font-bold text-rose-300 rounded-full shadow-lg border border-rose-500/30';
                }

                // If held for >= 1 second
                if (elapsed >= HOLD_DURATION_MS && confirmedGesture !== detected) {
                    confirmedGesture = detected;

                    if (detected === 'O_SHAPE') {
                        addLog('⭕ 머리 위 O 1초 유지 성공!', 'success-o');
                        if (navigator.vibrate) navigator.vibrate(100);

                        overlayDisplay.style.opacity = '1';
                        overlayBox.textContent = 'O';
                        overlayBox.className = 'text-[140px] md:text-[200px] font-black tracking-tighter text-emerald-400 animate-ox drop-shadow-[0_0_35px_rgba(52,211,153,0.8)]';

                        instructionEmoji.textContent = '⭕';
                        instructionText.textContent = '완벽한 동그라미(O) 확정!';
                        statusBadge.className = 'px-2.5 py-1 text-xs font-medium rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                        statusBadge.textContent = 'O 활성화됨';
                        statusDot.className = 'w-3 h-3 bg-emerald-500 rounded-full animate-ping';

                        cardO.className = 'bg-emerald-500/20 border border-emerald-500/50 rounded-xl p-3 text-center transition-all duration-300 flex items-center justify-center space-x-3 shadow-lg shadow-emerald-500/10';
                        statusOSub.textContent = '1초 유지 완료!';
                        statusOSub.className = 'text-[10px] text-emerald-300 font-bold';
                        cardX.className = 'bg-slate-800/50 border border-slate-700/50 rounded-xl p-3 text-center transition-all duration-300 flex items-center justify-center space-x-3 opacity-50';
                        statusXSub.textContent = '만세 포즈 대기';
                        statusXSub.className = 'text-[10px] text-slate-400';
                    } else if (detected === 'BANZAI_X') {
                        addLog('❌ 머리 위 만세(X) 1초 유지 성공!', 'success-x');
                        if (navigator.vibrate) navigator.vibrate([50, 50, 50]);

                        overlayDisplay.style.opacity = '1';
                        overlayBox.textContent = 'X';
                        overlayBox.className = 'text-[140px] md:text-[200px] font-black tracking-tighter text-rose-500 animate-ox drop-shadow-[0_0_35px_rgba(244,63,94,0.8)]';

                        instructionEmoji.textContent = '❌';
                        instructionText.textContent = '만세 포즈(X) 확정!';
                        statusBadge.className = 'px-2.5 py-1 text-xs font-medium rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30';
                        statusBadge.textContent = 'X 활성화됨';
                        statusDot.className = 'w-3 h-3 bg-rose-500 rounded-full animate-ping';

                        cardX.className = 'bg-rose-500/20 border border-rose-500/50 rounded-xl p-3 text-center transition-all duration-300 flex items-center justify-center space-x-3 shadow-lg shadow-rose-500/10';
                        statusXSub.textContent = '1초 유지 완료!';
                        statusXSub.className = 'text-[10px] text-rose-300 font-bold';
                        cardO.className = 'bg-slate-800/50 border border-slate-700/50 rounded-xl p-3 text-center transition-all duration-300 flex items-center justify-center space-x-3 opacity-50';
                        statusOSub.textContent = '머리 위 손 모음 대기';
                        statusOSub.className = 'text-[10px] text-slate-400';
                    }
                }
            } else {
                // No valid gesture detected
                currentDetectedGesture = 'NONE';
                gestureStartTime = null;
                progressIndicator.style.opacity = '0';

                if (confirmedGesture !== 'NONE') {
                    confirmedGesture = 'NONE';
                    overlayDisplay.style.opacity = '0';
                    statusBadge.className = 'px-2.5 py-1 text-xs font-medium rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20';
                    statusBadge.textContent = '대기 중';
                    statusDot.className = 'w-3 h-3 bg-amber-500 rounded-full animate-pulse';
                    instructionEmoji.textContent = '💡';
                    instructionText.textContent = '두 손을 머리 위로 올려 O 또는 만세(X)를 1초간 유지하세요';

                    cardO.className = 'bg-slate-800/50 border border-slate-700/50 rounded-xl p-3 text-center transition-all duration-300 flex items-center justify-center space-x-3';
                    statusOSub.textContent = '1초 유지 시 발동';
                    statusOSub.className = 'text-[10px] text-slate-400';
                    cardX.className = 'bg-slate-800/50 border border-slate-700/50 rounded-xl p-3 text-center transition-all duration-300 flex items-center justify-center space-x-3';
                    statusXSub.textContent = '1초 유지 시 발동';
                    statusXSub.className = 'text-[10px] text-slate-400';
                }
            }

            canvasCtx.restore();
        }

        // Initialize MediaPipe Hands
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        // Start Camera Stream Handler
        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            startBtn.textContent = '카메라 연결 중...';
            addLog('전방 카메라 스트림 요청 중...');

            try {
                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 640,
                    height: 480,
                    facingMode: 'user'
                });

                await camera.start();

                permissionHint.style.opacity = '0';
                setTimeout(() => {
                    permissionHint.style.display = 'none';
                }, 500);

                statusBadge.className = 'px-2.5 py-1 text-xs font-medium rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20';
                statusBadge.textContent = '인식 대기 중';
                addLog('카메라 연결 완료. 머리 위로 O 또는 만세 동작을 해주세요.', 'success-o');
            } catch (err) {
                console.error(err);
                addLog(`카메라 오류: ${err.message || '권한이 거부되었습니다.'}`, 'warn');
                startBtn.disabled = false;
                startBtn.textContent = '다시 시도하기';
                statusBadge.textContent = '연결 실패';
            }
        });
    </script>
</body>
</html>
